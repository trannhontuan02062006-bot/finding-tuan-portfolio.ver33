/* =========================================================================
   NỀN TẢNG
   ========================================================================= */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

/* BẮT BUỘC: html phải có nền riêng, nếu không mix-blend-mode của lưới sẽ hỏng */
html{ background:var(--giay); scroll-behavior:smooth; }

body{
  background:var(--giay);
  isolation:isolate;              /* BẮT BUỘC: để lưới crosshair blend đúng */
  color:var(--muc);
  font-family:'BTDanta', 'Segoe UI', system-ui, sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100svh;
}

/* Chữ kiểu "máy" dùng cho toạ độ, số hiệu, terminal */
.may{
  font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}

a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
:focus-visible{ outline:2px solid var(--do); outline-offset:3px; }
::selection{ background:var(--do); color:var(--giay); }

/* =========================================================================
   LỚP LƯỚI CROSSHAIR (giữ nguyên cơ chế từ file hiệu ứng gốc)
   ========================================================================= */
.luoi{
  position:fixed; inset:0; z-index:20;
  width:100%; height:100%;
  pointer-events:none;
  mix-blend-mode:difference;
}
.luoi svg{ display:block; width:100%; height:100%; shape-rendering:crispEdges; }

/* =========================================================================
   THANH ĐIỀU HƯỚNG
   ========================================================================= */
.nav{
  position:fixed; top:0; left:0; right:0; z-index:40;
  display:flex; align-items:center; justify-content:space-between;
  gap:16px;
  padding:14px var(--le);
  background:color-mix(in srgb, var(--giay) 86%, transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid transparent;
  transition:border-color .3s ease;
}
.nav.dinh{ border-bottom-color:var(--vien); }

.nav-ten{ font-weight:800; font-size:14px; letter-spacing:.14em; text-transform:uppercase; }
.nav-ten em{ font-style:normal; color:var(--do); }

.nav-menu{ display:flex; gap:clamp(14px,2.2vw,30px); align-items:center; }
.nav-menu a{
  font-size:11px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--muc-nhat); position:relative; padding:4px 0;
  transition:color .25s ease;
}
.nav-menu a::after{
  content:''; position:absolute; left:0; right:100%; bottom:0; height:1px;
  background:var(--do); transition:right .3s ease;
}
.nav-menu a:hover, .nav-menu a.dang-xem{ color:var(--muc); }
.nav-menu a:hover::after, .nav-menu a.dang-xem::after{ right:0; }

.nav-nut{
  display:none; background:none; border:1px solid var(--vien);
  padding:7px 12px; font:inherit; font-size:10px; font-weight:700;
  letter-spacing:.14em; text-transform:uppercase; color:var(--muc); cursor:pointer;
}

/* =========================================================================
   HERO
   ========================================================================= */
.hero{ position:relative; height:100svh; min-height:560px; overflow:hidden; }

(function(){
'use strict';

var $  = function(s, g){ return (g||document).querySelector(s); };
var el = function(id){ return document.getElementById(id); };
var itDong = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- Tiện ích chữ ---------- */
function thoat(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* **chữ** → in đậm ; *chữ* → tô đỏ */
function danh(s){
  return thoat(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<b>$1</b>');
}
function so4(n){ n = Math.max(0, Math.round(n)); return ('0000'+n).slice(-4); }

/* =========================================================================
   1. LƯỚI CROSSHAIR  —  cơ chế giữ nguyên từ file hiệu ứng gốc
   ========================================================================= */
var TOADO = { xs:[], ys:[], W:0, H:0 };

var chan = function(n){ return Math.round(n) + 0.5; };

function catKhuc(tong, tam, khe){
  var nua = khe/2, khuc = [], moc = 0;
  tam.slice().sort(function(a,b){ return a-b; }).forEach(function(t){
    if(t - nua > moc) khuc.push([moc, t - nua]);
    moc = t + nua;
  });
  if(moc < tong) khuc.push([moc, tong]);
  return khuc;
}

function veLuoi(){
  var boc = $('.luoi');
  var cf  = window.innerWidth < 768 ? GRID.mobile : GRID.desktop;

  /* Lề nội dung toàn trang luôn khớp với đường kẻ dọc ngoài cùng */
  document.documentElement.style.setProperty('--le', cf.le + 'px');

  var mauDuong = 'rgba(' + GRID.mau + ', ' + GRID.mo_duong + ')';
  var mauCong  = 'rgb(' + GRID.mau + ')';
  var W = window.innerWidth, H = window.innerHeight;

  var xs = [], nd = Math.max(2, cf.so_duong_doc), i;
  for(i = 0; i < nd; i++) xs.push(chan(cf.le + i * (W - cf.le*2) / (nd - 1)));

  var ys = [], nn = Math.max(1, cf.so_duong_ngang);
  for(i = 1; i <= nn; i++) ys.push(chan(H * i / (nn + 1)));

  var dDoc = '';
  xs.forEach(function(x){
    catKhuc(H, ys, cf.khe_ho).forEach(function(k){ dDoc += 'M' + x + ' ' + k[0] + 'V' + k[1]; });
  });

  var dNgang = '';
  ys.forEach(function(y){
    catKhuc(W, xs, cf.khe_ho).forEach(function(k){ dNgang += 'M' + k[0] + ' ' + y + 'H' + k[1]; });
  });

  var dCong = '', nua = cf.co_dau_cong/2;
  xs.forEach(function(x){ ys.forEach(function(y){
    dCong += 'M' + x + ' ' + (y-nua) + 'V' + (y+nua) + 'M' + (x-nua) + ' ' + y + 'H' + (x+nua);
  }); });

  boc.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="' + dDoc   + '" stroke="' + mauDuong + '" stroke-width="' + GRID.do_day + '" fill="none"/>' +
    '<path d="' + dNgang + '" stroke="' + mauDuong + '" stroke-width="' + GRID.do_day + '" fill="none"/>' +
    '<path d="' + dCong  + '" stroke="' + mauCong  + '" stroke-width="' + GRID.do_day +
      '" fill="none" opacity="' + GRID.mo_cong + '"/></svg>';

  TOADO = { xs:xs, ys:ys, W:W, H:H };
}

/* =========================================================================
   2. NEO BA CỤM CHỮ + CÂU TUYÊN NGÔN VÀO TOẠ ĐỘ LƯỚI
   ========================================================================= */
function dungCumChu(){
  var boc = el('cumBoc');
  boc.innerHTML = DATA.cumChu.slice(0,3).map(function(t){
    return '<div class="cum"><span class="cum-toado may"></span>' +

  }).join('');

  var tn = el('tuyenngon');
  tn.innerHTML = danh(DATA.tuyenNgon) +
    (DATA.tuyenNgonPhu ? '<span>' + thoat(DATA.tuyenNgonPhu) + '</span>' : '');
}

function dongBoCum(){
  var xs = TOADO.xs, ys = TOADO.ys, H = TOADO.H, W = TOADO.W;
  if(!xs.length || !ys.length) return;

  var cums = el('cumBoc').children;
  var day  = window.innerWidth < 768;
  var day_ngang = H - ys[0] + LAYOUT.cum_cach_duong;   /* đáy cụm chữ, tính từ đáy màn hình */
  var i, c;

  if(!day){
    /* Máy tính: mỗi cụm neo vào một đường kẻ dọc, xếp từ trái qua phải */
    for(i = 0; i < cums.length; i++){
      c = cums[i];
      c.style.left     = (xs[i] + LAYOUT.cum_lech_x) + 'px';
      c.style.bottom   = day_ngang + 'px';
      c.style.maxWidth = Math.max(120, (xs[i+1] || W) - xs[i] - LAYOUT.cum_lech_x*2) + 'px';
      c.firstChild.textContent = 'X:' + so4(xs[i]) + '  Y:' + so4(ys[0]);
    }
  } else {
    /* Điện thoại: xếp chồng dọc, cùng neo lên đường ngang thứ nhất */
    var acc = day_ngang;
    for(i = cums.length - 1; i >= 0; i--){
      c = cums[i];
      c.style.left     = (xs[0] + LAYOUT.cum_lech_x) + 'px';
      c.style.maxWidth = (W - xs[0]*2 - LAYOUT.cum_lech_x) + 'px';
      c.style.bottom   = acc + 'px';
      c.firstChild.textContent = 'X:' + so4(xs[0]) + '  Y:' + so4(ys[0]);
      acc += c.offsetHeight + 9;
    }
  }

  el('tuyenngon').style.left = (xs[0] + LAYOUT.cum_lech_x) + 'px';
  el('tuyenngon').style.right = (LAYOUT.cum_lech_x + (TOADO.W - xs[xs.length-1])) + 'px';
}

/* =========================================================================
   3. CỬA SỔ PHẦN MỀM — video / terminal / kéo thả
   ========================================================================= */
var cuaso = el('cuaso'), csThan = el('csThan'), csToado = el('csToado');

function manHinhTerminal(){
  csThan.innerHTML =
    '<div class="terminal">' +
      '<div class="mo">&gt; archive.mount /finding-tuan</div>' +
      '<div class="mo">&gt; stream --source ' + thoat(DATA.video.tenCuaSo || 'CAM-01') + '</div>' +
      '<div class="mo">[ ERR ] không nhận được tín hiệu</div>' +
      '<div class="chinh">Loading... Idea<span class="con-tro"></span></div>' +
    '</div>';
}

function phanTichVideo(url, tuChay){
  if(!url) return null;
  var u = String(url).trim(), m;
  if((m = u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/|live\/)|youtu\.be\/)([A-Za-z0-9_-]{6,})/)))
    return { loai:'iframe', src:'https://www.youtube.com/embed/' + m[1] +
      '?rel=0&modestbranding=1&playsinline=1' + (tuChay ? '&autoplay=1&mute=1&loop=1&playlist=' + m[1] : '') };
  if((m = u.match(/vimeo\.com\/(?:video\/)?(\d+)/)))
    return { loai:'iframe', src:'https://player.vimeo.com/video/' + m[1] +
      (tuChay ? '?autoplay=1&muted=1&loop=1' : '') };
  if(/\.(mp4|webm|ogv|mov)(\?|#|$)/i.test(u)) return { loai:'video', src:u };
  return { loai:'iframe', src:u };
}

function napVideo(){
  var v = phanTichVideo(DATA.video.link, DATA.video.tuChay);

  /* Không có link, hoặc máy đang ngoại tuyến → hiện thẳng màn hình terminal */
  if(!v || (navigator.onLine === false && v.loai === 'iframe')){ manHinhTerminal(); return; }

  if(v.loai === 'video'){
    var vd = document.createElement('video');
    vd.src = v.src; vd.playsInline = true; vd.controls = true;
    if(DATA.video.tuChay){ vd.autoplay = true; vd.muted = true; vd.loop = true; vd.controls = false; }
    vd.addEventListener('error', manHinhTerminal);
    csThan.innerHTML = ''; csThan.appendChild(vd);
    return;
  }

  var fr = document.createElement('iframe');
  var xong = false;
  fr.src = v.src;
  fr.allow = 'autoplay; encrypted-media; picture-in-picture';
  fr.setAttribute('allowfullscreen','');
  fr.title = 'Video portfolio';
  fr.addEventListener('load', function(){ xong = true; });
  fr.addEventListener('error', manHinhTerminal);
  csThan.innerHTML = ''; csThan.appendChild(fr);
  /* Sau 8 giây mà khung video chưa tải xong → coi như hỏng, đổi sang terminal */
  setTimeout(function(){ if(!xong) manHinhTerminal(); }, 8000);
}

/* ---------- Đặt vị trí & kéo thả ---------- */
var viTri = { x:0, y:0 }, daKeo = false;

function ganViTri(x, y){
  var r = cuaso.getBoundingClientRect();
  var maxX = window.innerWidth  - r.width;
  var maxY = window.innerHeight - r.height;
  viTri.x = Math.min(Math.max(x, 0), Math.max(0, maxX));
  viTri.y = Math.min(Math.max(y, 0), Math.max(0, maxY));
  cuaso.style.left = viTri.x + 'px';
  cuaso.style.top  = viTri.y + 'px';
  csToado.textContent = 'X:' + so4(viTri.x) + ' Y:' + so4(viTri.y);
}

function veGiua(){
  var r = cuaso.getBoundingClientRect();
  var x = (window.innerWidth - r.width)/2, y;

  if(window.innerWidth < 768 && TOADO.ys.length){
    /* Điện thoại: xếp cửa sổ vào đúng khoảng trống giữa cụm chữ và câu tuyên ngôn */
    var tn    = el('tuyenngon');
    var tren  = TOADO.ys[0] + 18;
    var duoi  = window.innerHeight - tn.offsetHeight
                - parseFloat(getComputedStyle(tn).bottom || 0) - 18;
    y = tren + Math.max(0, (duoi - tren - r.height) / 2);
  } else {
    y = (window.innerHeight - r.height)/2 + window.innerHeight * LAYOUT.cuaso_lech_y;
  }
  ganViTri(x, y);
}

(function batKeo(){
  var thanh = el('csThanh'), dangKeo = false, lechX = 0, lechY = 0, idCham = null;

  thanh.addEventListener('pointerdown', function(e){
    if(e.target.closest('.cs-thu')) return;
    dangKeo = true; idCham = e.pointerId; daKeo = true;
    var r = cuaso.getBoundingClientRect();
    lechX = e.clientX - r.left; lechY = e.clientY - r.top;
    cuaso.classList.add('dangkeo');
    thanh.setPointerCapture(e.pointerId);
    e.preventDefault();
  });

  thanh.addEventListener('pointermove', function(e){
    if(!dangKeo || e.pointerId !== idCham) return;
    ganViTri(e.clientX - lechX, e.clientY - lechY);
  });

  ['pointerup','pointercancel'].forEach(function(t){
    thanh.addEventListener(t, function(e){
      if(e.pointerId !== idCham) return;
      dangKeo = false; idCham = null; cuaso.classList.remove('dangkeo');
    });
  });

  /* Kéo bằng bàn phím — mũi tên, giữ Shift để đi nhanh hơn */
  thanh.tabIndex = 0;
  thanh.setAttribute('role','application');
  thanh.setAttribute('aria-label','Kéo cửa sổ bằng phím mũi tên');
  thanh.addEventListener('keydown', function(e){
    var b = e.shiftKey ? 40 : 10, d = { ArrowLeft:[-b,0], ArrowRight:[b,0], ArrowUp:[0,-b], ArrowDown:[0,b] }[e.key];
    if(!d) return;
    daKeo = true; ganViTri(viTri.x + d[0], viTri.y + d[1]); e.preventDefault();
  });
})();

var nguoiThuNho = false, tuThuNho = false;

function thuNho(){ cuaso.classList.add('an'); el('phuchoi').classList.add('hien'); }
function moLai(){  cuaso.classList.remove('an'); el('phuchoi').classList.remove('hien'); }

el('csThu').addEventListener('click', function(){ nguoiThuNho = true; tuThuNho = false; thuNho(); });
el('phuchoi').addEventListener('click', function(){
  nguoiThuNho = false; tuThuNho = false; moLai(); el('csThanh').focus();
});

/* Ra khỏi Hero thì cửa sổ tự thu về góc để không che nội dung;
   quay lại Hero thì tự mở ra. Nếu người dùng đã tự kéo hoặc tự thu nhỏ
   thì tôn trọng lựa chọn đó, không can thiệp. */
if('IntersectionObserver' in window){
  new IntersectionObserver(function(m){
    if(nguoiThuNho || daKeo) return;
    if(m[0].isIntersecting){ if(tuThuNho){ tuThuNho = false; moLai(); } }
    else if(!cuaso.classList.contains('an')){ tuThuNho = true; thuNho(); }
  }, { threshold:0.28 }).observe(el('hero'));
}

  /* Cuộn mượt + đóng menu trên điện thoại */
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href^="#"]');
    if(!a) return;
    var dich = document.querySelector(a.getAttribute('href'));
    if(!dich) return;
    e.preventDefault();
    dich.scrollIntoView({ behavior: itDong ? 'auto' : 'smooth', block:'start' });
    history.replaceState(null, '', a.getAttribute('href'));
    menu.classList.remove('mo');
    nut.setAttribute('aria-expanded','false'); nut.textContent = 'Menu';
  });

  addEventListener('scroll', function(){
    nav.classList.toggle('dinh', scrollY > 20);
  }, { passive:true });

  /* Hiện dần khi cuộn tới */
  if('IntersectionObserver' in window){
    var oRu = new IntersectionObserver(function(mucs){
      mucs.forEach(function(m){ if(m.isIntersecting){ m.target.classList.add('hien'); oRu.unobserve(m.target); } });
    }, { rootMargin:'0px 0px -12% 0px', threshold:0.05 });
    document.querySelectorAll('.ru').forEach(function(n){ oRu.observe(n); });

    /* Đánh dấu mục đang xem trên menu */
    var oXem = new IntersectionObserver(function(mucs){
      mucs.forEach(function(m){
        if(!m.isIntersecting) return;
        document.querySelectorAll('.nav-menu a').forEach(function(a){
          a.classList.toggle('dang-xem', a.dataset.muc === m.target.id);
        });
      });
    }, { rootMargin:'-45% 0px -50% 0px' });
    document.querySelectorAll('.muc').forEach(function(s){ oXem.observe(s); });
  } else {
    document.querySelectorAll('.ru').forEach(function(n){ n.classList.add('hien'); });
  }
}
