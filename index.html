/* =========================================================================
   5. TƯƠNG TÁC: menu, cuộn mượt, hiện dần
   ========================================================================= */
function batTuongTac(){
  /* Cuộn mượt cho mọi liên kết neo (#...) trong trang */
  document.addEventListener('click', function(e){
    var a = e.target.closest('a[href^="#"]');
    if(!a) return;
    var dich = document.querySelector(a.getAttribute('href'));
    if(!dich) return;
    e.preventDefault();
    dich.scrollIntoView({ behavior: itDong ? 'auto' : 'smooth', block:'start' });
    history.replaceState(null, '', a.getAttribute('href'));
  });

}

/* =========================================================================
   MÀN HÌNH MAIN
   Các dòng chữ kiểu terminal chạy dần ra, bị cắt theo đúng bóng của tấm bì
   hồ sơ nên hình từ từ hiện lên. Chạy xong thì đổi sang ẢNH THẬT, giữ 2 giây,
   rồi ảnh thu nhỏ dạt sang trái và chữ gõ ra bên phải.
   ========================================================================= */
/* =========================================================================
   MAIN SECTION
   Một phần ba trên: hai cột nhật ký chạy chữ.
   Hai phần ba dưới: cụm vật phẩm được in ra bằng ASCII rồi hoá thành ảnh.
   Không dùng WebGL — toàn bộ chữ ASCII vẽ bằng canvas 2D, và vì hình đứng
   yên nên chỉ cần vẽ THÊM phần mới mỗi khung, rất nhẹ.
   ========================================================================= */
function batManHinh(){
  if(!MAIN.bat) return null;

  var boc   = el('manHinh');
  var oTren = el('mhTren'), oCot = [];
  var oDuoi = el('mhDuoi'), oCum = el('mhCum');
  var oNen  = el('xemNen');
  var oHud  = el('hud'),   oTrai  = el('hudTrai'), oPhai = el('hudPhai');
  var oKhung= el('hudKhung'), oDay = el('hudDay');
  var cvL   = el('hudLan');
  var ctxL  = cvL ? cvL.getContext('2d') : null;
  var cv    = el('mhAscii'), ctx  = cv.getContext('2d');
  var cvN   = el('mhNhieu'), ctxN = cvN.getContext('2d');
  var dpr   = Math.min(window.devicePixelRatio || 1, 2);

  var W = 0, CH = 0, caoThanh = 0;
  var hopCum = null, vat = [], sanSang = false, soAnh = 0, daTai = 0;
  var pha = 'nghi';          /* nghi | in | hoa | xong */
  var batDau = 0, hen = [];

  /* ---------------------------------------------------------------------
     Tải ảnh
     --------------------------------------------------------------------- */
  var anh = {};
  function tai(ten, src){
    soAnh++;
    var i = new Image();
    i.onload = i.onerror = function(){ daTai++; if(daTai === soAnh) sanSang = true; };
    i.src = src; anh[ten] = i;
  }
  for(var _k = 0; _k < CUMVAT.length; _k++) tai(CUMVAT[_k].ma, ANH[CUMVAT[_k].ma]);

  /* ---------------------------------------------------------------------
     Bố cục: cụm vật phẩm nằm gọn trong hai phần ba dưới
     --------------------------------------------------------------------- */
  function tinhBoCuc(){
    W = window.innerWidth;
    caoThanh = Math.round(el('csThanh').getBoundingClientRect().height) || 0;
    CH = Math.max(1, window.innerHeight - caoThanh);

    var caoTren = CH * MAIN.phan_tren;
    boc.style.top      = caoThanh + 'px';   /* chừa trọn thanh IDEA.EXE */
    oTren.style.top    = '0px';
    oTren.style.height = caoTren + 'px';
    oDuoi.style.top    = caoTren + 'px';
    oDuoi.style.height = (CH - caoTren) + 'px';

    /* Khung của cụm: co vừa vặn trong vùng dưới, giữ đúng tỉ lệ của bản vẽ */
    var vW = W, vH = CH - caoTren;
    var le = MAIN.le_cum;
    var k = Math.min((vW * (1 - le * 2)) / CUMTILE, (vH * (1 - le * 2)));
    var cw = k * CUMTILE, chh = k;
    hopCum = { x:(vW - cw) / 2, y:(vH - chh) / 2, w:cw, h:chh };

    [cv, cvN].forEach(function(c){
      c.width  = Math.round(vW * dpr);
      c.height = Math.round(vH * dpr);
      c.style.width = vW + 'px'; c.style.height = vH + 'px';
    });

    vat = [];
    for(var i = 0; i < CUMVAT.length; i++){
      var v = CUMVAT[i], im = anh[v.ma];
      if(!im || !im.naturalWidth) return false;
      var h = hopCum.h * v.cao / 100;
      var w = h * im.naturalWidth / im.naturalHeight;
      vat.push({ def:v, im:im,
                 cx: hopCum.x + hopCum.w * v.x / 100,
                 cy: hopCum.y + hopCum.h * v.y / 100,
                 w:w, h:h, goc:v.goc * Math.PI / 180, o:[], p:0, xoa:0, nut:null });
    }
    return true;
  }

  /* Đặt các thẻ ảnh đúng chỗ, đúng góc nghiêng của bản vẽ */
  function dungAnh(){
    oCum.innerHTML = '';
    for(var i = 0; i < vat.length; i++){
      var v = vat[i];
      var n = document.createElement('div');
      n.className = 'cum-vat';
      n.setAttribute('data-i', i);
      if(v.def.xem !== false) n.className += ' xem-duoc';
      n.innerHTML = '<img draggable="false" alt="' + thoat(v.def.ten) + '" src="' + v.im.src + '">' +
        (LOE.bat ? '<i class="vat-loe"></i>' + (LOE.quet ? '<i class="vat-quet"></i>' : '') : '') +
        '<i class="vat-scan"></i>';
      n.style.left   = (v.cx - v.w / 2) + 'px';
      n.style.top    = (v.cy - v.h / 2) + 'px';
      n.style.width  = v.w + 'px';
      n.style.height = v.h + 'px';
      n.style.zIndex = String(v.def.lop || 1);
      oCum.appendChild(n);
      v.nut = n; v.tam = n.querySelector('img'); v.i = i;

      /* Hai lớp loé sáng lấy CHÍNH TẤM ẢNH làm mặt nạ, nên ánh sáng bám đúng
         theo hình dáng hiện vật thay vì loang ra một ô vuông.             */
      v.loe  = n.querySelector('.vat-loe');
      v.quet = n.querySelector('.vat-quet');
      var naAnh = 'url("' + String(v.im.src).replace(/"/g, '%22') + '")';
      if(v.loe){
        v.loe.style.webkitMaskImage = v.loe.style.maskImage = naAnh;
        v.loe.style.setProperty('--loe-mau', LOE.mau || '255, 246, 246');
        v.loe.style.setProperty('--loe-bk', (LOE.ban_kinh || 62) + '%');
      }
      if(v.quet){
        v.quet.style.webkitMaskImage = v.quet.style.maskImage = naAnh;
        v.quet.style.setProperty('--quet-ms', (LOE.quet_ms || 560) + 'ms');
      }
      v.scan = n.querySelector('.vat-scan');
      if(v.scan) v.scan.style.webkitMaskImage = v.scan.style.maskImage = naAnh;

      /* VÙNG CHẠM: hiện vật nhỏ hơn 44px thì nới thêm một viền vô hình quanh
         nó cho vừa đầu ngón tay. Chỉ làm trên thiết bị cảm ứng.           */
      if(mayCham){
        var can = MAIN.cham_toi_thieu || 44;
        var noi = Math.max(0, (can - Math.min(v.w, v.h)) / 2);
        n.style.setProperty('--cham', noi.toFixed(1) + 'px');
      }
      v.dx = 0; v.dy = 0; v.ox = 0; v.oy = 0; v.mx = 0; v.my = 0;
      v.vx = 0; v.vy = 0; v._px = null; v._py = null;
      v.manh = 0; v.zoom = 0; v.dichZoom = 0;
      datVatTF(v);
    }
  }

  /* ---------------------------------------------------------------------
     Lưới ASCII của từng vật phẩm
     --------------------------------------------------------------------- */
  var thang = '', kho = '', khongDocDuoc = false;
  function chuTheoSang(s){
    var i = Math.round(Math.max(0, Math.min(1, s)) * (thang.length - 1));
    while(i < thang.length && thang.charAt(i) === ' ') i++;
    return thang.charAt(Math.min(i, thang.length - 1)) || '.';
  }

  function dungLuoi(){
    thang = String(MAIN.thang_do); kho = String(MAIN.kho);
    var S = (W < 768 ? MAIN.co_o_mobile : MAIN.co_o);
    var tiLe = MAIN.ti_le_o, nguong = MAIN.nguong_duc;
    var tong = 0;

    for(var i = 0; i < vat.length; i++){
      var v = vat[i];
      var rw = Math.max(24, Math.round(v.w)), rh = Math.max(24, Math.round(v.h));
      var c = document.createElement('canvas'); c.width = rw; c.height = rh;
      var g = c.getContext('2d', { willReadFrequently:true });
      g.drawImage(v.im, 0, 0, rw, rh);
      var d;
    try{ d = g.getImageData(0, 0, rw, rh).data; }
    catch(e){ khongDocDuoc = true; return null; }

      var oW = S * tiLe, oH = S;
      var cot = Math.max(1, Math.floor(rw / oW)), dong = Math.max(1, Math.floor(rh / oH));
      var oc = [], sang = [], r, k, x0, y0, x1, y1, xx, yy, p, sa, sr, sg, sb, dem;
      for(r = 0; r < dong; r++){
        y0 = Math.floor(r * oH); y1 = Math.min(rh, Math.floor((r + 1) * oH));
        for(k = 0; k < cot; k++){
          x0 = Math.floor(k * oW); x1 = Math.min(rw, Math.floor((k + 1) * oW));
          sa = sr = sg = sb = dem = 0;
          for(yy = y0; yy < y1; yy++) for(xx = x0; xx < x1; xx++){
            p = (yy * rw + xx) * 4;
            sa += d[p+3]; sr += d[p]; sg += d[p+1]; sb += d[p+2]; dem++;
          }
          if(!dem || sa / dem <= nguong) continue;
          var cr = sr/dem, cg = sg/dem, cb = sb/dem;
          var dx = (x0 + x1) / 2 - rw / 2, dy = (y0 + y1) / 2 - rh / 2;
          var s = (0.299*cr + 0.587*cg + 0.114*cb) / 255;
          oc.push({ dx:dx, dy:dy, mau:'rgb(' + (cr|0) + ',' + (cg|0) + ',' + (cb|0) + ')', s:s });
          sang.push(s);
        }
      }
      /* Giãn tương phản để thang ký tự được dùng hết */
      sang.sort(function(a, b){ return a - b; });
      var lo = sang[Math.floor(sang.length * 0.02)] || 0;
      var hi = sang[Math.floor(sang.length * 0.98)] || 1;
      var dai = Math.max(0.02, hi - lo);

      var co = Math.cos(v.goc), si = Math.sin(v.goc);
      for(k = 0; k < oc.length; k++){
        var e = oc[k];
        e.ch = chuTheoSang((e.s - lo) / dai);
        e.x  = v.cx + e.dx * co - e.dy * si;   /* toạ độ trên màn */
        e.y  = v.cy + e.dx * si + e.dy * co;
      }
      oc.sort(function(a, b){ return a.y - b.y; });
      v.o = oc; v.p = 0; v.xoa = 0; v.oW = oW; v.oH = oH;
      tong += oc.length;
    }
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.font = '700 ' + S.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    return tong;
  }

  /* ---------------------------------------------------------------------
     Mốc quét: đường ngang chạy từ đỉnh xuống đáy vùng dưới
     --------------------------------------------------------------------- */
  function mocY(p){
    var y0 = hopCum.y - hopCum.h * 0.08, y1 = hopCum.y + hopCum.h * 1.08;
    return y0 + (y1 - y0) * p;
  }

  /* In thêm phần ASCII vừa lọt vào dưới đường quét */
  function inTiep(front){
    for(var i = 0; i < vat.length; i++){
      var v = vat[i], oc = v.o;
      if(v.p >= oc.length || oc[v.p].y > front) continue;
      ctx.save();
      ctx.translate(v.cx, v.cy); ctx.rotate(v.goc); ctx.translate(-v.cx, -v.cy);
      while(v.p < oc.length && oc[v.p].y <= front){
        var e = oc[v.p];
        /* vẽ trong hệ đã xoay: dùng lại toạ độ chưa xoay quanh tâm */
        ctx.fillStyle = MAIN.mau_code;
        ctx.fillText(e.ch, v.cx + e.dx, v.cy + e.dy);
        v.p++;
      }
      ctx.restore();
    }
  }

  /* Dải nhiễu chạy ngay trước đường quét, vẽ lên lớp phủ rồi xoá mỗi khung */
  function veNhieu(front){
    var b = MAIN.dai_nhieu * hopCum.h;
    var g = ctxN;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr);
    g.font = ctx.font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save();
    g.globalAlpha = 0.55;
    for(var i = 0; i < vat.length; i++){
      var v = vat[i], oc = v.o, j = v.p, dem = 0;
      if(j >= oc.length) continue;
      g.save();
      g.translate(v.cx, v.cy); g.rotate(v.goc); g.translate(-v.cx, -v.cy);
      g.fillStyle = MAIN.mau_nhieu;
      while(j < oc.length && oc[j].y <= front + b && dem < 260){
        var e = oc[j];
        g.fillText(kho.charAt((Math.random() * kho.length) | 0), v.cx + e.dx, v.cy + e.dy);
        j++; dem++;
      }
      g.restore();
    }
    g.restore();
  }

  /* Hai mặt nạ NGƯỢC NHAU, đặt trên cùng một khung toạ độ của vùng dưới:
     lớp ảnh hiện dần từ trên xuống, lớp chữ ASCII lùi đi đúng nhịp đó.
     Nhờ dùng chung một hệ toạ độ nên hai mép luôn trùng khít.             */
  function datNa(e, p, nguoc, len){
    if(!e) return;
    var m = MAIN.mem_quet, c = len ? 'to top' : 'to bottom';
    var a = (p * 100 - m).toFixed(1), b = (p * 100 + m).toFixed(1);
    e.style.maskImage = e.style.webkitMaskImage = nguoc
      ? 'linear-gradient(' + c + ', rgba(0,0,0,0) ' + a + '%, #000 ' + b + '%)'
      : 'linear-gradient(' + c + ', #000 ' + a + '%, rgba(0,0,0,0) ' + b + '%)';
  }

  /* Dải nhiễu đỏ chạy NGAY TRƯỚC mép ảnh khi quét từ dưới lên */
  function veNhieuLen(front){
    var b = MAIN.dai_nhieu * hopCum.h, g = ctxN;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr);
    g.font = ctx.font; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.save(); g.globalAlpha = 0.62;
    for(var i = 0; i < vat.length; i++){
      var v = vat[i], oc = v.o, dem = 0;
      g.save();
      g.translate(v.cx, v.cy); g.rotate(v.goc); g.translate(-v.cx, -v.cy);
      g.fillStyle = MAIN.mau_nhieu;
      for(var j = oc.length - 1; j >= 0 && dem < 300; j--){
        var e = oc[j];
        if(e.y > front) continue;        /* đã hoá thành ảnh rồi   */
        if(e.y < front - b) break;       /* ra khỏi dải nhiễu      */
        g.fillText(kho.charAt((Math.random() * kho.length) | 0), v.cx + e.dx, v.cy + e.dy);
        dem++;
      }
      g.restore();
    }
    g.restore();
  }

  /* =====================================================================
     TƯƠNG TÁC VỚI TỪNG HIỆN VẬT
     Nghiêng 3D theo toạ độ con trỏ · kéo thả · bấm để phóng to xem chi tiết
     ===================================================================== */
  var reVat = -1, keoVat = -1, phongVat = -1, quay = null;

  function nhoMH(){ return W < 768; }

  /* Đích khi phóng to — tính trong hệ toạ độ của vùng dưới */
  function hopXem(v){
    var caoTren = CH * MAIN.phan_tren;
    var n = nhoMH();
    var h = CH * (n ? MAIN.xem_cao_m : MAIN.xem_cao) / 100;
    var r = W  * (n ? MAIN.xem_rong_m : MAIN.xem_rong) / 100;
    /* Vừa khít theo CẢ chiều cao lẫn chiều rộng — nếu không thì hiện vật
       nằm ngang như cuộn băng sẽ phóng ra quá khổ.                        */
    var ti = Math.min(h / Math.max(1, v.h), r / Math.max(1, v.w));
    return { x: W * (n ? MAIN.xem_x_m : MAIN.xem_x) / 100,
             y: (n ? CH * MAIN.xem_y_m / 100 : CH / 2) - caoTren,
             ti: ti, w: v.w * ti, h: v.h * ti };
  }

  /* Ghép chuỗi transform cho một hiện vật.
     Thứ tự: dịch (kéo + phóng) → phối cảnh → nghiêng 3D → nghiêng cố định
     → tỉ lệ. Khi đang phóng to thì độ nghiêng cố định và nghiêng 3D tan dần. */
  function datVatTF(v){
    var n = v.nut; if(!n) return;
    var z = v.zoom || 0, X = hopXem(v);
    var cx = v.cx + (v.dx || 0) * (1 - z) + (X.x - v.cx) * z;
    var cy = v.cy + (v.dy || 0) * (1 - z) + (X.y - v.cy) * z;
    var ti = (1 + (MAIN.phong || 0) * (v.manh || 0) * (1 - z)) * (1 + (X.ti - 1) * z);
    /* Nghiêng theo con trỏ (máy tính) CỘNG nghiêng theo cảm biến (điện thoại) */
    var gB =  ((v.mx || 0) * (v.manh || 0) + MAY.x) * (MAIN.goc_3d || 0);
    var gA = -((v.my || 0) * (v.manh || 0) + MAY.y) * (MAIN.goc_3d || 0);
    /* NGHIÊNG THEO HƯỚNG KÉO: vật lắc trong mặt phẳng như tấm bìa bị lôi đi,
       đồng thời ngả thêm theo trục 3D cùng chiều với tay.                 */
    var gh = Math.max(-1, Math.min(1, (v.vx || 0) / 26));
    var gv = Math.max(-1, Math.min(1, (v.vy || 0) / 26));
    var lac = -gh * (MAIN.keo_lac || 12) * (1 - z);
    gB +=  gh * (MAIN.keo_nghieng || 10) * (1 - z);
    gA += -gv * (MAIN.keo_nghieng || 10) * (1 - z);
    var gc = v.def.goc * (1 - z) + lac;

    /* CHỐNG VỠ ẢNH: khi đang đứng yên ở mức phóng to, đặt kích thước THẬT cho
       thẻ và bỏ scale đi, để trình duyệt vẽ lại tấm ảnh ở đúng cỡ đó. Nếu cứ
       để transform:scale thì lớp đã được vẽ sẵn ở cỡ nhỏ rồi kéo giãn ra —
       chính là chỗ ảnh bị vỡ.                                              */
    var net = z > 0.995;
    var wq = net ? v.w * ti : v.w, hq = net ? v.h * ti : v.h;
    var sc = net ? 1 : ti;
    if(v._net !== net || net){
      n.style.width  = wq + 'px';  n.style.height = hq + 'px';
      n.style.left   = (cx - wq / 2) + 'px';
      n.style.top    = (cy - hq / 2) + 'px';
      v._net = net;
    }
    var tx = net ? 0 : cx - v.cx, ty = net ? 0 : cy - v.cy;
    if(!net){
      n.style.left = (v.cx - v.w / 2) + 'px';
      n.style.top  = (v.cy - v.h / 2) + 'px';
    }
    n.style.transform =
      'translate(' + tx.toFixed(1) + 'px,' + ty.toFixed(1) + 'px) ' +
      'perspective(' + (MAIN.chieu_sau || 1000) + 'px) ' +
      'rotateX(' + gA.toFixed(2) + 'deg) rotateY(' + gB.toFixed(2) + 'deg) ' +
      'rotate(' + gc.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')';
    n.style.zIndex = z > 0.01 ? '60' : (keoVat === v.i ? '50' : String(v.def.lop || 1));

    /* BÓNG ĐỔ chạy ngược chiều nghiêng */
    var nhac = (keoVat === v.i) ? 1 : (v.manh || 0);
    var bx = -(v.mx || 0) * (MAIN.bong_lech || 22);
    var by = (MAIN.bong_cao || 16) + (1 - (v.my || 0)) * (MAIN.bong_lech || 22) * 0.4 + nhac * 12;
    var nhoe = (MAIN.bong_nhoe || 26) + nhac * 16;

    /* VIỀN SÁNG kiểu trinh thám: một quầng sáng mảnh ôm đúng theo mép hiện
       vật, đậm dần khi con trỏ đang ở trên. Ghép NỐI TIẾP vào bóng đổ nên
       hai hiệu ứng chồng lên nhau chứ không cái nào đè cái nào.           */
    var mLoe = v.manh || 0;
    var vien = (LOE.bat && LOE.vien)
      ? ' drop-shadow(0 0 ' + ((LOE.vien_nhoe || 14) * mLoe).toFixed(1) + 'px rgba(' +
        (LOE.mau || '255, 246, 246') + ',' + ((LOE.vien_dam || 0.45) * mLoe).toFixed(3) + '))'
      : '';
    if(v.tam) v.tam.style.filter =
      'drop-shadow(' + bx.toFixed(1) + 'px ' + by.toFixed(1) + 'px ' + nhoe.toFixed(0) +
      'px rgba(0,0,0,' + (0.38 + nhac * 0.12).toFixed(2) + '))' + vien;

    /* QUẦNG ĐÈN PIN bám theo con trỏ, cắt theo hình dáng hiện vật */
    if(v.loe){
      v.loe.style.opacity = (mLoe * (LOE.do_sang == null ? 0.5 : LOE.do_sang)).toFixed(3);
      v.loe.style.setProperty('--sx', (50 + (v.mx || 0) * 45).toFixed(1) + '%');
      v.loe.style.setProperty('--sy', (50 + (v.my || 0) * 45).toFixed(1) + '%');
    }

    /* Ghi lại trạng thái khung này để hàm vẽ dòng code quét dùng lại */
    v._cx = cx; v._cy = cy; v._ti = ti; v._gc = gc;

    var khac = phongVat >= 0 && phongVat !== v.i;
    n.style.opacity = khac ? '0.10' : '1';
    n.style.pointerEvents = khac ? 'none' : 'auto';
  }

  function chanTrongVung(v){
    /* Hiện vật đi được khắp Main Section. Mốc y = 0 của vùng dưới nằm ở
       'caoTren', nên y = -caoTren chính là mép dưới thanh tiêu đề IDEA.EXE.
       Chừa thêm le px nữa để không bao giờ chạm vào thanh đó.             */
    var caoTren = CH * MAIN.phan_tren;
    var caoDuoi = CH - caoTren, le = MAIN.le_keo == null ? 10 : MAIN.le_keo;
    var nuaW = v.w / 2, nuaH = v.h / 2;
    var xMin = le + nuaW - v.cx,  xMax = W - le - nuaW - v.cx;
    var yMin = (-caoTren + le) + nuaH - v.cy;
    var yMax = (caoDuoi - le) - nuaH - v.cy;
    v.dx = xMax >= xMin ? Math.max(xMin, Math.min(xMax, v.dx)) : 0;
    v.dy = yMax >= yMin ? Math.max(yMin, Math.min(yMax, v.dy)) : 0;
  }

  /* Chạm: đặt luôn toạ độ nghiêng theo điểm chạm, khỏi chờ rê chuột */
  function vaoVatCham(i, px, py){
    var v = vat[i];
    var my = py - caoThanh - CH * MAIN.phan_tren;
    v.ox = Math.max(-1, Math.min(1, (px - v.cx - (v.dx || 0)) / (v.w / 2)));
    v.oy = Math.max(-1, Math.min(1, (my - v.cy - (v.dy || 0)) / (v.h / 2)));
  }

  var mayCu = { x:0, y:0 };
  function chay(){
    var yen = true, k = MAIN.muot || 0.18, i;
    /* Máy vừa nghiêng thì phải vẽ tiếp dù mọi thứ khác đã đứng yên */
    if(Math.abs(MAY.x - mayCu.x) > 0.0015 || Math.abs(MAY.y - mayCu.y) > 0.0015) yen = false;
    mayCu.x = MAY.x; mayCu.y = MAY.y;
    for(i = 0; i < vat.length; i++){
      var v = vat[i];
      var dRe = (reVat === i) ? 1 : 0;   /* rê được cả khi đang phóng to */
      var dZ  = (phongVat === i) ? 1 : 0;
      var kz  = 1 - Math.pow(0.001, 16 / Math.max(60, MAIN.xem_nhip));
      if(Math.abs(v.mx - v.ox) > 0.002 || Math.abs(v.my - v.oy) > 0.002 ||
         Math.abs(v.manh - dRe) > 0.002 || Math.abs(v.zoom - dZ) > 0.002) yen = false;
      v.mx += (v.ox - v.mx) * k;
      v.my += (v.oy - v.my) * k;
      v.manh += (dRe - v.manh) * k;
      if(keoVat !== i){ v.vx *= 0.86; v.vy *= 0.86;
        if(Math.abs(v.vx) < 0.02) v.vx = 0;
        if(Math.abs(v.vy) < 0.02) v.vy = 0; }
      if(Math.abs(v.vx) > 0.02 || Math.abs(v.vy) > 0.02) yen = false;
      v.zoom += (dZ - v.zoom) * kz;
      datVatTF(v);
    }
    if(yen){ quay = null; return; }
    quay = requestAnimationFrame(chay);
  }
  function day(){ if(!quay) quay = requestAnimationFrame(chay); }

  function moXem(i){
    if(pha !== 'xong') return;
    var v = vat[i];
    if(v.def.xem === false) return;      /* hiện vật này không cho phóng to */
    phongVat = i; reVat = -1;
    boc.classList.add('dangXem');
    oNen.classList.add('hien');
    dungHUD(v);                          /* dựng sẵn các khối, còn ẩn */
    oHud.classList.add('hien');
    day();

    /* NHỊP 1 — khung ngắm bốn góc bật ra khi hiện vật đã về giữa màn hình */
    hen.push(setTimeout(function(){
      if(phongVat < 0) return;
      datKhung(v);
      void boc.offsetHeight;
      oHud.classList.add('ra-khung');
    }, itDong ? 0 : (MAIN.hud_tre || 320)));

    /* NHỊP 2 — dòng code quét lên xuống trên bề mặt hiện vật */
    batQuet(v);

    /* NHỊP 3 — quét xong thì mã LAN RA từ tâm vật. Đường nối được vẽ dần từ
       mép vật ra ngoài, và sóng mã chạm tới khối nào thì khối đó hiện ra. */
    hen.push(setTimeout(function(){
      if(phongVat < 0) return;
      veDay(v);
      void boc.offsetHeight;
      oHud.classList.add('ra');
      batLan(v);
      bungKhoi(v);
    }, itDong ? 0 : (MAIN.lan_tre || 940)));
  }

  /* Tâm hiện vật khi đang phóng, tính theo hệ toạ độ của .man-hinh */
  function tamVat(v){
    var X = hopXem(v);
    return { x:X.x, y:CH * MAIN.phan_tren + X.y };
  }

  /* =====================================================================
     SÓNG MÃ LAN RA
     Một vòng ký tự nở ra từ tâm hiện vật. Chạm tới đâu, khối dữ liệu ở đó
     hoá hình tới đó — nên chữ trông như được chính hiện vật đẩy ra.
     ===================================================================== */
  var lanTT = null;
  function batLan(v){
    if(itDong || !ctxL) return;
    cvL.width  = Math.round(W * dpr);
    cvL.height = Math.round(CH * dpr);
    cvL.style.width  = W + 'px';
    cvL.style.height = CH + 'px';
    var t = tamVat(v), R = 0;
    R = Math.max(R, Math.sqrt(t.x * t.x + t.y * t.y));
    R = Math.max(R, Math.sqrt((W - t.x) * (W - t.x) + t.y * t.y));
    R = Math.max(R, Math.sqrt(t.x * t.x + (CH - t.y) * (CH - t.y)));
    R = Math.max(R, Math.sqrt((W - t.x) * (W - t.x) + (CH - t.y) * (CH - t.y)));
    lanTT = { cx:t.x, cy:t.y, R:R, bd:0 };
    requestAnimationFrame(chayLan);
  }
  function ngungLan(){
    lanTT = null;
    if(ctxL){
      ctxL.setTransform(dpr, 0, 0, dpr, 0, 0);
      ctxL.clearRect(0, 0, cvL.width / dpr, cvL.height / dpr);
    }
  }
  function chayLan(luc){
    if(!lanTT || !ctxL) return;
    if(!lanTT.bd) lanTT.bd = luc;
    var tong = MAIN.lan_ms || 900;
    var p = (luc - lanTT.bd) / tong;
    if(p >= 1.3){ ngungLan(); return; }

    var g = ctxL;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, W, CH);
    var R   = Math.min(1, p) * lanTT.R;
    var day = MAIN.lan_day || 130;
    var S   = (W < 768 ? MAIN.co_o_mobile : MAIN.co_o) * 1.6;
    var gx  = S * 0.62, gy = S * 1.05;
    var K   = kho || String(MAIN.kho || '#');
    g.font = '700 ' + S.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var tat = p > 1 ? Math.max(0, 1 - (p - 1) / 0.3) : 1;
    var n = MAIN.lan_so || 460;
    for(var i = 0; i < n; i++){
      var a  = (i / n) * Math.PI * 2 + Math.random() * 0.09;
      var rr = R - Math.random() * day;
      if(rr < 12) continue;
      var x = lanTT.cx + Math.cos(a) * rr;
      var y = lanTT.cy + Math.sin(a) * rr;
      if(x < -20 || x > W + 20 || y < -20 || y > CH + 20) continue;
      var f = 1 - (R - rr) / day;
      g.globalAlpha = (0.12 + f * 0.88) * tat;
      g.fillStyle = f > 0.72 ? '#FFF6F6' : (f > 0.34 ? MAIN.mau_code : MAIN.mau_nhieu);
      g.fillText(K.charAt((Math.random() * K.length) | 0),
                 Math.round(x / gx) * gx, Math.round(y / gy) * gy);
    }
    g.globalAlpha = 1;
    requestAnimationFrame(chayLan);
  }

  /* =====================================================================
     KHUNG NGẮM bốn góc + nhãn, ôm quanh hiện vật đang phóng
     ===================================================================== */
  function datKhung(v){
    if(!oKhung) return;
    var X = hopXem(v), caoTren = CH * MAIN.phan_tren;
    var no = nhoMH() ? 12 : 20;
    oKhung.style.left   = (X.x - X.w / 2 - no) + 'px';
    oKhung.style.top    = (caoTren + X.y - X.h / 2 - no) + 'px';
    oKhung.style.width  = (X.w + no * 2) + 'px';
    oKhung.style.height = (X.h + no * 2) + 'px';
    oKhung.innerHTML = '<i></i><i></i><i></i><i></i><b>' +
      thoat(v.def.ma_ho_so) + ' · ĐANG TRÍCH XUẤT</b>';
  }

  /* Đường nối chạy từ mép hiện vật sang hai cột dữ liệu */
  function veDay(v){
    if(!oDay) return;
    var X = hopXem(v), caoTren = CH * MAIN.phan_tren;
    var cy = caoTren + X.y, tr = X.x - X.w / 2 - 20, ph = X.x + X.w / 2 + 20;
    var r  = boc.getBoundingClientRect();
    var d  = [];
    function canh(o, ben){
      if(!o || !o.offsetWidth) return;
      var b = o.getBoundingClientRect();
      var x = (ben ? b.left : b.right) - r.left;
      var y = b.top - r.top + Math.min(b.height * 0.5, 42);
      d.push(ben ? ('M' + ph + ' ' + cy + 'H' + ((x + ph) / 2) + 'V' + y + 'H' + x)
                 : ('M' + tr + ' ' + cy + 'H' + ((x + tr) / 2) + 'V' + y + 'H' + x));
      d.push('CIRCLE' + x + ',' + y);
    }
    if(!nhoMH()) canh(oTrai, 0);
    canh(oPhai, 1);
    var svg = '';
    for(var k = 0; k < d.length; k++){
      if(d[k].indexOf('CIRCLE') === 0){
        var p = d[k].slice(6).split(',');
        svg += '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="2.5"></circle>';
      } else {
        svg += '<path d="' + d[k] + '" style="--dai:' +
               Math.round(Math.abs(W) + Math.abs(CH)) + '"></path>';
      }
    }
    oDay.innerHTML = svg;

    /* Đặt --dai bằng ĐỘ DÀI THẬT của từng đường, để nét được vẽ dần đều từ
       phía hiện vật ra ngoài thay vì loé ra ở đoạn cuối.                  */
    var ps = oDay.querySelectorAll('path');
    for(var j = 0; j < ps.length; j++){
      var L = 0;
      try { L = ps[j].getTotalLength(); } catch(err) { L = 0; }
      if(!L || !isFinite(L)) L = 600;
      ps[j].style.setProperty('--dai', Math.round(L));
      ps[j].style.setProperty('--ve', ((MAIN.lan_ms || 900) * 0.8).toFixed(0) + 'ms');
    }
  }

  /* =====================================================================
     DÒNG CODE QUÉT TRÊN BỀ MẶT HIỆN VẬT
     Dải sáng chạy lên chạy xuống, và các ký tự code được vẽ đúng vào lưới
     ASCII đã tính sẵn của chính hiện vật đó — nên chữ bám theo đúng hình.
     ===================================================================== */
  var quetTT = null;
  function batQuet(v){
    if(itDong){ return; }
    quetTT = { v:v, bd:0 };
    if(v.scan) v.scan.style.opacity = '1';
    requestAnimationFrame(chayQuet);
  }
  function ngungQuet(){
    if(quetTT && quetTT.v && quetTT.v.scan) quetTT.v.scan.style.opacity = '0';
    quetTT = null;
    if(ctxN){ ctxN.setTransform(dpr,0,0,dpr,0,0);
      ctxN.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr); }
  }
  function chayQuet(luc){
    if(!quetTT) return;
    var v = quetTT.v;
    if(!quetTT.bd) quetTT.bd = luc;
    var tong = MAIN.quet_ms || 1500;
    var p = Math.min(1, (luc - quetTT.bd) / tong);
    /* Sóng tam giác: chạy xuống rồi chạy lên, lặp quet_lan lượt */
    var lan = MAIN.quet_lan || 2;
    var q = (p * lan) % 1;
    var xuong = Math.floor(p * lan) % 2 === 0;
    var t = xuong ? q : 1 - q;

    if(v.scan) v.scan.style.setProperty('--qy', (t * 130 - 15).toFixed(1) + '%');
    veQuetMa(v, (t - 0.5) * v.h, v.h * (MAIN.quet_day || 0.13));

    if(p < 1){ requestAnimationFrame(chayQuet); return; }
    ngungQuet();
  }
  function veQuetMa(v, tam, dai){
    var g = ctxN; if(!g) return;
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    g.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr);
    var oc = v.o; if(!oc || !oc.length || dai <= 0) return;
    var ti = v._ti || 1;
    var S  = (W < 768 ? MAIN.co_o_mobile : MAIN.co_o) * ti;
    g.font = '700 ' + S.toFixed(1) + 'px ui-monospace, Menlo, Consolas, monospace';
    g.textAlign = 'center'; g.textBaseline = 'middle';
    var rad = (v._gc || 0) * Math.PI / 180;
    var co = Math.cos(rad), si = Math.sin(rad);
    var cx = v._cx == null ? v.cx : v._cx;
    var cy = v._cy == null ? v.cy : v._cy;
    var toiDa = MAIN.quet_toi_da || 700, dem = 0;
    for(var k = 0; k < oc.length && dem < toiDa; k++){
      var e = oc[k], cach = Math.abs(e.dy - tam);
      if(cach > dai) continue;
      var a = 1 - cach / dai;
      g.globalAlpha = 0.22 + a * 0.78;
      g.fillStyle = a > 0.74 ? '#FFF6F6' : (a > 0.4 ? MAIN.mau_code : MAIN.mau_nhieu);
      g.fillText(kho.charAt((Math.random() * kho.length) | 0),
                 cx + (e.dx * co - e.dy * si) * ti,
                 cy + (e.dx * si + e.dy * co) * ti);
      dem++;
    }
    g.globalAlpha = 1;
  }

  /* =====================================================================
     CÁC KHỐI DỮ LIỆU bung ra hai bên
     ===================================================================== */
  var khoiHUD = [];
  function dungHUD(v){
    var t = v.def.the || {}, nho = nhoMH(), k;
    oTrai.innerHTML = ''; oPhai.innerHTML = ''; khoiHUD = [];
    if(oDay) oDay.innerHTML = '';

    var ds = [];
    /* Khối 1 — danh tính hiện vật */
    ds.push({ ben:0, html:
      '<div class="nhan"><span data-ma>' + thoat(t.loai || 'TANG VẬT') + '</span></div>' +
      '<div class="hud-ma" data-ma>' + thoat(v.def.ma_ho_so) + '</div>' +
      '<h2 class="hud-ten">' + thoat(v.def.ten) + '</h2>' });

    /* Khối 2 — bảng thông số */
    var tr = t.truong || [];
    if(tr.length){
      var h = '<div class="nhan"><span data-ma>THÔNG SỐ</span></div>';
      for(k = 0; k < tr.length; k++)
        h += '<div class="the-truong"><b>' + thoat(tr[k][0]) +
             '</b><i></i><span>' + thoat(tr[k][1]) + '</span></div>';
      ds.push({ ben:0, html:h });
    }

    /* Các khối nội dung — sang bên phải */
    var kh = t.khoi || [];
    for(k = 0; k < kh.length; k++)
      ds.push({ ben:1, html:
        '<div class="nhan"><span data-ma>' + thoat(kh[k].ten) + '</span></div>' +
        '<div class="the-khoi"><div class="than">' +
        (kh[k].dong || []).map(function(d){
          return '<div class="d">' + thoat(d) + '</div>';
        }).join('') +
        '</div></div>' });

    for(k = 0; k < ds.length; k++){
      var o = document.createElement('div');
      o.className = 'hud-o';
      o.innerHTML = ds[k].html;
      if(nho){
        /* Điện thoại: dồn về một cột, so le trái–phải cho vẫn thấy "hai bên" */
        if(k % 2 === 0) o.className += ' le-trai';
        oPhai.appendChild(o);
      } else {
        (ds[k].ben ? oPhai : oTrai).appendChild(o);
      }
      khoiHUD.push(o);
    }
    oTrai.scrollTop = 0; oPhai.scrollTop = 0;
  }

  /* Mỗi khối chờ đúng lúc SÓNG MÃ chạm tới mép trong của nó rồi mới hoá hình.
     Nhờ vậy khối gần hiện vật hiện trước, khối xa hiện sau — đúng nhịp lan. */
  function bungKhoi(v){
    var r   = boc.getBoundingClientRect();
    var t   = v ? tamVat(v) : { x:W / 2, y:CH / 2 };
    var R   = lanTT ? lanTT.R : Math.sqrt(W * W + CH * CH);
    var tong= itDong ? 0 : (MAIN.lan_ms || 900);
    var nho = nhoMH();
    for(var k = 0; k < khoiHUD.length; k++){
      var o = khoiHUD[k], b = o.getBoundingClientRect(), tre;
      if(b.width){
        var tr = b.left - r.left, ph = b.right - r.left;
        /* mép TRONG = mép quay về phía hiện vật */
        var ex = nho ? (tr + b.width / 2) : (ph < t.x ? ph : tr);
        var ey = nho ? (b.top - r.top) : (b.top - r.top + b.height / 2);
        var kc = Math.sqrt((ex - t.x) * (ex - t.x) + (ey - t.y) * (ey - t.y));
        tre = Math.min(1, kc / R) * tong;
      } else tre = k * (itDong ? 0 : (MAIN.bang_le || 95));
      (function(o2, ms){
        hen.push(setTimeout(function(){
          o2.classList.add('ra');
          var j, ma = o2.querySelectorAll('[data-ma]');
          for(j = 0; j < ma.length; j++)
            giaiChu(ma[j], itDong ? 0 : (MAIN.xem_giai || 260));
          /* Chữ trong khối cũng hiện ra dạng mã rồi giải dần, cho khớp với
             cảm giác vừa được trích xuất ra từ hiện vật.                  */
          var th = o2.querySelectorAll('.than .d, .the-truong span');
          for(j = 0; j < th.length; j++)
            giaiChu(th[j], itDong ? 0 : Math.round((MAIN.xem_giai || 260) * 1.5));
        }, ms));
      })(o, tre);
    }
  }

  /* Giải mã tại chỗ nội dung chữ của một phần tử */
  function giaiChu(e, thoiGian){
    var chu = e.textContent; if(!chu) return;
    e.innerHTML = '<span class="mh-ro"></span><span class="mh-ma"></span>';
    var a = e.firstChild, b = e.lastChild;
    var K = String(MAIN.kho || '#'), bd = -1, khung = 0;
    if(thoiGian <= 0){ a.textContent = chu; return; }
    function ngau(m){
      var t = '';
      for(var i = 0; i < m.length; i++){
        var c = m.charAt(i);
        t += (c === ' ') ? ' ' : K.charAt((Math.random() * K.length) | 0);
      }
      return t;
    }
    b.textContent = ngau(chu);
    (function buoc(t){
      if(bd < 0) bd = t;
      var p = Math.min(1, (t - bd) / thoiGian);
      var n = Math.round(p * chu.length);
      a.textContent = chu.slice(0, n);
      if(n < chu.length){
        if((++khung % 2) === 0) b.textContent = ngau(chu.slice(n));
        requestAnimationFrame(buoc);
      } else b.textContent = '';
    })(performance.now());
  }
  function dongXem(){
    if(phongVat < 0) return;
    phongVat = -1;
    ngungQuet(); ngungLan();
    boc.classList.remove('dangXem');
    oNen.classList.remove('hien');
    oHud.classList.remove('hien', 'ra', 'ra-khung');
    for(var k = 0; k < khoiHUD.length; k++) khoiHUD[k].classList.remove('ra');
    /* Dọn sạch nội dung sau khi mờ hẳn. Nếu để lại, khối chữ vẫn nằm nguyên
       đó: vẫn bôi đen copy được, và kéo hiện vật ngang qua vùng đó thì mất
       tương tác vì thao tác chuột bị khối chữ nuốt mất.                   */
    hen.push(setTimeout(function(){
      if(phongVat >= 0) return;
      oTrai.innerHTML = ''; oPhai.innerHTML = ''; khoiHUD = [];
      if(oDay)   oDay.innerHTML = '';
      if(oKhung) oKhung.innerHTML = '';
    }, itDong ? 0 : 340));
    day();
  }

  function batTuongTacVat(){
    if(batTuongTacVat.roi) return; batTuongTacVat.roi = true;
    var x0 = 0, y0 = 0, dx0 = 0, dy0 = 0, daDi = false, nutKeo = null;
    /* Trạng thái riêng cho thao tác cảm ứng */
    var vatDang = -1, henGiu = null, laCham = false;
    function huyGiu(){ if(henGiu){ clearTimeout(henGiu); henGiu = null; } }

    /* Bắn một vệt loé chéo qua mặt hiện vật — chạy đúng một lần */
    function loeQuet(i){
      var v = vat[i]; if(!v || !v.quet || !v.nut) return;
      v.nut.classList.remove('loe-quet');
      void v.nut.offsetWidth;                 /* buộc trình duyệt chạy lại */
      v.nut.classList.add('loe-quet');
    }

    function chiSo(e){
      var t = e.target;
      while(t && t !== oCum){
        if(t.classList && t.classList.contains('cum-vat'))
          return parseInt(t.getAttribute('data-i'), 10);
        t = t.parentNode;
      }
      return -1;
    }

    oCum.addEventListener('pointerover', function(e){
      if(pha !== 'xong' || keoVat >= 0) return;
      if(e.pointerType === 'touch') return;      /* cảm ứng lo ở pointerdown */
      var i = chiSo(e); if(i < 0 || !MAIN.nghieng) return;
      if(phongVat >= 0 && i !== phongVat) return;
      reVat = i; loeQuet(i); day();
    });
    oCum.addEventListener('pointerout', function(e){
      var i = chiSo(e);
      if(i >= 0 && i === reVat && keoVat < 0){
        /* KHÔNG đặt lại ox/oy về 0 — nếu đặt thì quầng sáng trôi về tâm rồi
           mới tắt, trông rất giả. Để nguyên chỗ cuối rồi mờ dần tại đó.
           Độ nghiêng vẫn tự trở về phẳng vì nó được nhân với 'manh'.     */
        reVat = -1; day();
      }
    });
    addEventListener('pointermove', function(e){
      if(reVat >= 0 && keoVat < 0){
        var v = vat[reVat], X = hopXem(v), z = v.zoom || 0;
        /* tâm và nửa kích thước HIỆN TẠI, kể cả khi đang phóng to */
        var tx = v.cx + (v.dx || 0) * (1 - z) + (X.x - v.cx) * z;
        var ty0 = v.cy + (v.dy || 0) * (1 - z) + (X.y - v.cy) * z;
        var ti = 1 + (X.ti - 1) * z;
        var my = e.clientY - caoThanh - CH * MAIN.phan_tren;
        v.ox = Math.max(-1, Math.min(1, (e.clientX - tx) / (v.w * ti / 2)));
        v.oy = Math.max(-1, Math.min(1, (my - ty0) / (v.h * ti / 2)));
        day();
      }
      /* Đang trong 250ms chờ giữ: ngón tay xê dịch quá ngưỡng thì huỷ, để
         không nhầm một cú vuốt thành cú chạm mở chi tiết.                 */
      if(keoVat < 0 && henGiu && laCham &&
         Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > (MAIN.cham_di || 12)){
        huyGiu(); daDi = true;
      }
      if(keoVat >= 0){
        var h = vat[keoVat];
        /* Tốc độ kéo → dùng để lắc và nghiêng vật theo hướng đang bị lôi đi */
        h.vx += ((e.clientX - (h._px == null ? e.clientX : h._px)) - h.vx) * 0.35;
        h.vy += ((e.clientY - (h._py == null ? e.clientY : h._py)) - h.vy) * 0.35;
        h._px = e.clientX; h._py = e.clientY;
        h.dx = dx0 + e.clientX - x0;
        h.dy = dy0 + e.clientY - y0;
        chanTrongVung(h);
        if(Math.abs(e.clientX - x0) + Math.abs(e.clientY - y0) > 5) daDi = true;
        datVatTF(h);
      }
    }, { passive:true });

    oCum.addEventListener('pointerdown', function(e){
      if(pha !== 'xong') return;      /* code còn đang hoá thành tệp */
      var i = chiSo(e); if(i < 0) return;
      if(phongVat >= 0){ if(i !== phongVat) moXem(i); return; }
      laCham = (e.pointerType === 'touch');
      vatDang = i; daDi = false;
      x0 = e.clientX; y0 = e.clientY; dx0 = vat[i].dx; dy0 = vat[i].dy;
      nutKeo = vat[i].nut;
      try{ nutKeo.setPointerCapture(e.pointerId); }catch(err){}

      if(laCham){
        /* ĐIỆN THOẠI — chạm nhanh thì MỞ CHI TIẾT, giữ lâu mới vào chế độ KÉO.
           Không dùng ngưỡng vài px nữa vì ngón tay luôn xê dịch đôi chút.  */
        reVat = i; vaoVatCham(i, e.clientX, e.clientY); loeQuet(i); day();
        huyGiu();
        henGiu = setTimeout(function(){
          henGiu = null;
          if(vatDang < 0) return;
          keoVat = vatDang;
          daDi = true;                         /* đã vào kéo → nhả ra không mở */
          if(MAIN.keo_tha && nutKeo && nutKeo.classList) nutKeo.classList.add('keo');
          if(navigator.vibrate){ try{ navigator.vibrate(12); }catch(err){} }
          day();
        }, MAIN.cham_giu == null ? 250 : MAIN.cham_giu);
      } else {
        /* MÁY TÍNH — giữ nguyên nếp cũ: bấm giữ là kéo, bấm nhả là mở */
        keoVat = i;
        if(MAIN.keo_tha && nutKeo.classList) nutKeo.classList.add('keo');
        e.preventDefault();
      }
    });
    function nha(){
      huyGiu();
      if(keoVat < 0){
        /* Chưa kịp vào chế độ kéo → đây là một cú CHẠM NHANH */
        var j = vatDang; vatDang = -1;
        if(laCham){
          reVat = -1;
          if(j >= 0 && !daDi) moXem(j);
          day();
        }
        return;
      }
      if(nutKeo && nutKeo.classList) nutKeo.classList.remove('keo');
      var i = keoVat; keoVat = -1; nutKeo = null; vatDang = -1;
      vat[i]._px = null; vat[i]._py = null;
      if(!daDi) moXem(i);          /* bấm mà không kéo → phóng to */
      if(laCham) reVat = -1;
      day();
    }
    oCum.addEventListener('pointerup', nha);
    oCum.addEventListener('pointercancel', nha);

    /* Bấm vào một tab trên thanh BIOS */
    oTren.addEventListener('click', function(e){
      var b = e.target;
      while(b && b !== oTren && !(b.tagName === 'BUTTON' && b.hasAttribute('data-tab')))
        b = b.parentNode;
      if(b && b !== oTren){ chonTab(Number(b.getAttribute('data-tab')) || 0, true); }
    });

    /* Bấm vào một dòng trích dẫn tang vật */
    oTren.addEventListener('click', function(e){
      if(pha !== 'xong') return;
      var t = e.target;
      while(t && t !== oTren && !(t.classList &&
            (t.classList.contains('co-vat') || t.classList.contains('co-link')))) t = t.parentNode;
      if(!t || t === oTren) return;
      if(t.classList.contains('co-link')){
        var u = t.getAttribute('data-url');
        if(u) window.open(u, u.indexOf('mailto:') === 0 ? '_self' : '_blank', 'noopener');
        return;
      }
      var i = parseInt(t.getAttribute('data-vat'), 10);
      if(isNaN(i) || i < 0 || i >= vat.length) return;
      if(vat[i].def.xem === false){
        if(t.nextSibling && t.nextSibling.className &&
           t.nextSibling.className.indexOf('loi') >= 0) return;
        var l = document.createElement('div');
        l.className = 'dong loi';
        t.parentNode.insertBefore(l, t.nextSibling);
        giaiDongMa(l, '! ERROR 403 · ' + (vat[i].def.tep || vat[i].def.ma) + ' chưa được giải mật',
                   itDong ? 0 : (MAIN.xem_giai || 260));
        return;
      }
      moXem(i);
    });

    /* Trên điện thoại: vuốt XUỐNG trên thẻ chi tiết (khi đã ở đầu thẻ) thì
       đóng thẻ lại — cử chỉ quen thuộc, thay cho việc phải bấm ra ngoài.  */
    (function(){
      var y0 = null;
      oPhai.addEventListener('touchstart', function(e){
        y0 = (oPhai.scrollTop <= 0 && e.touches[0]) ? e.touches[0].clientY : null;
      }, { passive:true });
      oPhai.addEventListener('touchmove', function(e){
        if(y0 == null || !e.touches[0]) return;
        if(e.touches[0].clientY - y0 > 70){ y0 = null; dongXem(); }
      }, { passive:true });
      oPhai.addEventListener('touchend', function(){ y0 = null; }, { passive:true });
    })();

    oNen.addEventListener('click', dongXem);
    addEventListener('keydown', function(e){ if(e.key === 'Escape') dongXem(); });
  }

  /* ---------------------------------------------------------------------
     Hai cột nhật ký ở một phần ba trên
     --------------------------------------------------------------------- */
  /* Gõ MỘT DÒNG kèm mã hoá: phần đã gõ là chữ thật, ngay trước con trỏ có
     một đuôi ký tự rác màu đỏ chạy theo — đọc ra giống code đang được sinh. */
  function goDongMa(o, chu, buoc, xong){
    var a = document.createElement('span'); a.className = 'mh-ro';
    var b = document.createElement('span'); b.className = 'mh-ma';
    o.appendChild(a); o.appendChild(b);
    var i = 0, duoi = MAIN.ma_duoi == null ? 5 : MAIN.ma_duoi;
    var K = String(MAIN.kho || '#');
    if(buoc <= 0){ a.textContent = chu; if(xong) xong(); return; }
    (function b1(){
      a.textContent = chu.slice(0, i);
      if(i < chu.length){
        var n = Math.min(duoi, chu.length - i), t = '';
        for(var k = 0; k < n; k++){
          var c = chu.charAt(i + k);
          t += (c === ' ') ? ' ' : K.charAt((Math.random() * K.length) | 0);
        }
        b.textContent = t;
        i++;
        hen.push(setTimeout(b1, buoc));
      } else { b.textContent = ''; if(xong) xong(); }
    })();
  }

  /* Cả dòng hiện NGAY dưới dạng mã, rồi giải dần từ trái sang phải.
     Nhanh hơn gõ từng ký tự rất nhiều mà vẫn giữ nguyên cảm giác Scramble. */
  function giaiDongMa(o, chu, thoiGian){
    var a = document.createElement('span'); a.className = 'mh-ro';
    var b = document.createElement('span'); b.className = 'mh-ma';
    o.appendChild(a); o.appendChild(b);
    var K = String(MAIN.kho || '#'), bd = -1, khung = 0;
    if(thoiGian <= 0){ a.textContent = chu; return; }
    function ngau(mau){
      var t = '';
      for(var k = 0; k < mau.length; k++){
        var c = mau.charAt(k);
        t += (c === ' ') ? ' ' : K.charAt((Math.random() * K.length) | 0);
      }
      return t;
    }
    b.textContent = ngau(chu);
    (function buoc(t){
      if(bd < 0) bd = t;
      var p = Math.min(1, (t - bd) / thoiGian);
      var n = Math.round(p * chu.length);
      a.textContent = chu.slice(0, n);
      if(n < chu.length){
        if((++khung % 2) === 0) b.textContent = ngau(chu.slice(n));
        requestAnimationFrame(buoc);
      } else b.textContent = '';
    })(performance.now());
  }

  /* Nở "@tangvat" thành danh sách lấy thẳng từ CUMVAT, nên thêm bớt hiện vật
     là danh sách tự cập nhật theo.                                        */
  function chiSoVat(ma){
    for(var k = 0; k < CUMVAT.length; k++) if(CUMVAT[k].ma === ma) return k;
    return -1;
  }
  function noDanhSach(ds){
    var ra = [], i, k;
    for(i = 0; i < ds.length; i++){
      var m = ds[i];
      if(m === '@tangvat' || m === '@khoa' || m === '@mo'){
        for(k = 0; k < CUMVAT.length; k++){
          var c = CUMVAT[k], khoa = (c.xem === false);
          if(m === '@khoa' && !khoa) continue;
          if(m === '@mo'   &&  khoa) continue;
          /* Chỉ hiện TÊN TỆP, không kèm mã hồ sơ EV-00x nữa */
          var ten = ((c.tep || c.ma) + ' ');
          while(ten.length < 20) ten += '.';
          ra.push({ chu:'> ' + ten + ' [' + (khoa ? 'lock' : 'open') + ']',
                    vat:k, mo:!khoa });
        }
        continue;
      }
      /* cho phép khai báo vat bằng mã chữ ("a4") thay vì chỉ số */
      if(m && m.vat != null && typeof m.vat === 'string'){
        var q = chiSoVat(m.vat);
        ra.push({ chu:m.chu, vat:q, mo:(q >= 0 && CUMVAT[q].xem !== false) });
        continue;
      }
      ra.push(m);
    }
    return ra;
  }

  /* Dựng bảng điều khiển BIOS: dải trạng thái · thanh tab · lưới bảng.
     oLuoi được dựng lại mỗi lần nên phải lấy tham chiếu mới sau khi dựng. */
  var oLuoi = null, oTab = null, tabDang = 0;

  function dungCot(){
    var i, c, H = '';
    oTren.innerHTML = ''; oCot = [];

    /* Tầng 1 — dải trạng thái */
    var dd = [].concat(DATA.biosDau || []);
    if(dd.length){
      H += '<div class="bios-dau">';
      for(i = 0; i < dd.length; i++){
        var t = String(dd[i]), phu = t.indexOf('phu ') === 0;
        H += '<span' + (phu ? ' class="phu"' : '') + '>' +
             thoat(phu ? t.slice(4) : t) + '</span>';
      }
      H += '</div>';
    }

    /* Tầng 2 — thanh tab trong khung viền */
    H += '<div class="bios-tab">';
    for(i = 0; i < DATA.cot.length; i++){
      c = DATA.cot[i];
      var nhan = c.tab || String(c.ten || ('COT ' + (i + 1))).replace(/\.[^.]*$/, '');
      H += '<button type="button" data-tab="' + i + '"' +
           (i === 0 ? ' class="chon"' : '') + '>' + thoat(nhan) + '</button>';
    }
    H += '</div>';

    /* Tầng 3 — lưới các bảng dữ liệu */
    H += '<div class="bios-luoi"></div>';
    oTren.innerHTML = H;

    oLuoi = oTren.querySelector('.bios-luoi');
    oTab  = oTren.querySelector('.bios-tab');
    tabDang = 0;

    /* Tiếng lệnh lặp ở đầu mỗi dòng */
    var tl = MAIN.tieng_lenh == null ? 'ECHO' : String(MAIN.tieng_lenh).replace(/"/g, '');
    oLuoi.style.setProperty('--pre', '"' + tl + '"');
    /* Máng rộng đúng bằng độ dài tiếng lệnh cộng một khoảng thở. Bỏ tiếng
       lệnh đi thì máng cũng biến mất chứ không để lại lề trống.         */
    oLuoi.style.setProperty('--pre-w', tl ? ((tl.length * 0.6 + 0.7).toFixed(2) + 'em') : '0em');

    if(!nhoMH()){
      oLuoi.style.gridTemplateColumns =
        'repeat(' + DATA.cot.length + ', minmax(0, 1fr))';
      oLuoi.style.columnGap = (MAIN.cot_cach || 26) + 'px';
    }

    for(i = 0; i < DATA.cot.length; i++){
      c = DATA.cot[i];
      var d = document.createElement('div');
      d.className = 'cot';
      d.innerHTML = '<div class="cot-nhan"></div><div class="cot-than"></div>';
      oLuoi.appendChild(d);
      oCot.push(d.querySelector('.cot-than'));
    }
    datNhanCot();

    /* Vuốt ngang trên điện thoại thì tab tự sáng theo bảng đang xem */
    if(nhoMH()) oLuoi.addEventListener('scroll', function(){
      var b = oLuoi.querySelectorAll('.cot');
      if(!b.length) return;
      var k = Math.round(oLuoi.scrollLeft / Math.max(1, b[0].offsetWidth + 8));
      chonTab(Math.max(0, Math.min(DATA.cot.length - 1, k)), false);
    }, { passive:true });
  }

  /* Nhãn chế độ: đo bề ngang thật của bảng để ghi ra số cột ký tự, y như
     dòng "MODE CON: COLS=80 LINES=35" của một tệp batch thật.            */
  function datNhanCot(){
    if(!oLuoi) return;
    var b = oLuoi.querySelectorAll('.cot');
    for(var i = 0; i < b.length && i < DATA.cot.length; i++){
      var than = b[i].querySelector('.cot-than');
      var nhan = b[i].querySelector('.cot-nhan');
      if(!than || !nhan) continue;
      var cO = parseFloat(getComputedStyle(than).fontSize) * 0.6 || 7;
      var so = Math.max(8, Math.round(than.clientWidth / cO));
      var sd = noDanhSach(DATA.cot[i].dong || []).length;
      nhan.textContent = 'BEGIN ' + String(DATA.cot[i].ten || '') +
        '  MODE CON: COLS=' + so + ' LINES=' + ('0' + sd).slice(-2);
    }
  }

  function chonTab(i, cuon){
    if(!oTab) return;
    var n = oTab.querySelectorAll('button');
    for(var k = 0; k < n.length; k++) n[k].classList.toggle('chon', k === i);
    tabDang = i;
    if(cuon && oLuoi && nhoMH()){
      var b = oLuoi.querySelectorAll('.cot');
      if(b[i]) oLuoi.scrollTo({ left:b[i].offsetLeft - oLuoi.offsetLeft,
                                behavior: itDong ? 'auto' : 'smooth' });
    }
  }

  function goCot(o, ds, tongMs, xong, noiThem){
    /* tongMs = null → dùng nhịp cố định MAIN.xem_go (bảng chi tiết).
       Ngược lại tự chia nhịp để cột gõ xong ĐÚNG lúc chữ ASCII in xong.   */
    var buoc, nghi;
    if(tongMs == null){
      buoc = itDong ? 0 : (MAIN.xem_go || 14); nghi = buoc * 6;
    } else {
      /* MỘT NHỊP CHUNG cho mọi cột — không chia theo độ dài từng cột nữa,
         nhờ vậy ba cột gõ đều tăm tắp y như một cửa sổ dòng lệnh thật.   */
      buoc = itDong ? 0 : (MAIN.go_cot == null ? 10 : MAIN.go_cot);
      nghi = itDong ? 0 : (MAIN.go_nghi == null ? 70 : MAIN.go_nghi);
    }
    ds = noDanhSach(ds);

    /* Đuôi con trỏ "|" nhấp nháy — luôn được dời xuống dòng đang gõ, gõ xong
       cả cột thì nằm lại ở cuối dòng cuối cùng.                           */
    var tro = null;
    if(tongMs != null && !itDong){
      tro = document.createElement('span');
      tro.className = 'go-tro';
      tro.textContent = '|';
    }
    if(!noiThem) o.innerHTML = '';

    /* Bảng chi tiết dùng chế độ nhanh: đổ hết dòng ra, mỗi dòng lệch nhau
       một nhịp ngắn rồi tự giải mã tại chỗ.                               */
    if(tongMs == null && MAIN.xem_nhanh){
      for(var k = 0; k < ds.length; k++){
        (function(k){
          hen.push(setTimeout(function(){
            var m = ds[k], chu = (m && m.chu != null) ? m.chu : m;
            var d = document.createElement('div');
            d.className = 'dong' + (/^\$/.test(chu) ? ' sang' : '');
            o.appendChild(d);
            giaiDongMa(d, chu, itDong ? 0 : (MAIN.xem_giai || 260));
            if(k === ds.length - 1 && xong) xong();
          }, k * (itDong ? 0 : (MAIN.xem_le_dong || 46))));
        })(k);
      }
      return;
    }

    var i = 0;
    (function dong(){
      if(i >= ds.length){ if(xong) xong(); return; }
      var m = ds[i], chu = (m && m.chu != null) ? m.chu : m;
      var d = document.createElement('div');
      d.className = 'dong' + (/^\$/.test(chu) ? ' sang' : '');
      if(m && m.vat != null && m.vat >= 0){
        d.className += ' co-vat' + (m.mo ? '' : ' khoa');
        d.setAttribute('data-vat', m.vat);
      } else if(m && m.url){
        d.className += ' co-link';
        d.setAttribute('data-url', m.url);
      }
      o.appendChild(d);
      i++;
      goDongMa(d, chu, buoc, function(){
        o.scrollTop = o.scrollHeight;
        hen.push(setTimeout(dong, nghi));
      });
      if(tro) d.appendChild(tro);
    })();
  }

  /* Trả mọi thứ về trạng thái sạch. Gọi sau khi Main Section đã mờ hẳn,
     hoặc gọi ngay trước khi mở lại.                                       */
  var henDon = null;
  function donDep(){
    if(henDon){ clearTimeout(henDon); henDon = null; }
    phongVat = -1; reVat = -1; keoVat = -1;
    if(quay){ cancelAnimationFrame(quay); quay = null; }
    ngungQuet(); ngungLan();
    boc.classList.remove('dangXem');
    oNen.classList.remove('hien');
    oHud.classList.remove('hien', 'ra', 'ra-khung');
    oTrai.innerHTML = ''; oPhai.innerHTML = ''; khoiHUD = [];
    if(oDay)   oDay.innerHTML = '';
    if(oKhung) oKhung.innerHTML = '';
    oCum.classList.remove('song');
    oCum.style.maskImage = oCum.style.webkitMaskImage = '';
    if(cv) cv.style.maskImage = cv.style.webkitMaskImage = '';
    oTren.innerHTML = ''; oCot = [];
    if(ctx)  ctx.clearRect(0, 0, cv.width, cv.height);
    if(ctxN) ctxN.clearRect(0, 0, cvN.width, cvN.height);
    for(var i = 0; i < vat.length; i++){
      var v = vat[i];
      v.p = 0; v.dx = 0; v.dy = 0; v.ox = 0; v.oy = 0;
      v.mx = 0; v.my = 0; v.manh = 0; v.zoom = 0; v._net = null;
      v.vx = 0; v.vy = 0; v._px = null; v._py = null;
      if(v.loe)  v.loe.style.opacity  = '0';
      if(v.scan) v.scan.style.opacity = '0';
      if(v.nut){
        v.nut.classList.remove('loe-quet', 'keo');
        v.nut.style.transform = ''; v.nut.style.opacity = '';
        v.nut.style.zIndex = ''; v.nut.style.pointerEvents = '';
        v.nut.style.width = v.w + 'px'; v.nut.style.height = v.h + 'px';
        v.nut.style.left = (v.cx - v.w / 2) + 'px';
        v.nut.style.top  = (v.cy - v.h / 2) + 'px';
      }
      if(v.tam) v.tam.style.filter = '';
    }
  }

  /* ---------------------------------------------------------------------
     Vòng lặp
     --------------------------------------------------------------------- */
  function vong(luc){
    if(pha === 'nghi') return;
    if(!batDau) batDau = luc;
    var t = luc - batDau;
    var T1 = itDong ? 0 : MAIN.in_ascii;
    var T2 = T1 + (itDong ? 0 : MAIN.giu);
    var T3 = T2 + (itDong ? 0 : MAIN.hoa_anh);

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    if(t < T1){
      var p = T1 > 0 ? t / T1 : 1;
      inTiep(mocY(p));
      veNhieu(mocY(p));
    } else if(t < T2){
      inTiep(mocY(1));
      ctxN.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr);
    } else {
      var q = T3 > T2 ? Math.min(1, (t - T2) / (T3 - T2)) : 1;
      inTiep(mocY(1));
      /* Lần quét thứ hai chạy TỪ DƯỚI LÊN: ảnh thật dâng lên lấp chỗ chữ */
      var caoDuoi = CH - CH * MAIN.phan_tren;
      var fLen = mocY(1 - q);                       /* mép ảnh, toạ độ màn  */
      veNhieuLen(fLen);
      var pq = Math.max(0, Math.min(1, (caoDuoi - fLen) / Math.max(1, caoDuoi)));
      datNa(oCum, pq, false, true);
      datNa(cv,   pq, true,  true);
      if(q >= 1){
        pha = 'xong';
        oCum.style.maskImage = oCum.style.webkitMaskImage = '';
        cv.style.maskImage = cv.style.webkitMaskImage = '';
        ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr);
        ctxN.clearRect(0, 0, cvN.width / dpr, cvN.height / dpr);
        oCum.classList.add('song');
        batTuongTacVat();
        return;
      }
    }
    requestAnimationFrame(vong);
  }

  addEventListener('resize', function(){
    if(pha === 'nghi') return;
    if(tinhBoCuc()){ datNhanCot(); dungLuoi(); dungAnh();
      if(pha === 'xong'){
        oCum.style.maskImage = oCum.style.webkitMaskImage = '';
        ctx.clearRect(0, 0, cv.width / dpr, cv.height / dpr);
        oCum.classList.add('song');
      }
    }
  }, { passive:true });

  return {
    mo: function(){
      if(!sanSang || pha !== 'nghi') return;
      donDep();                    /* xoá sạch dấu vết lần trước */
      if(!tinhBoCuc()) return;
      var soO = dungLuoi();
      dungAnh();
      if(khongDocDuoc || !soO){
        /* Không đọc được điểm ảnh (mở bằng file://) → bỏ qua bước ASCII,
           cho hiện vật hiện thẳng ra rồi bật tương tác.                  */
        console.warn('Không đọc được điểm ảnh của ảnh — hiệu ứng ASCII bị bỏ qua. ' +
                     'Hãy chạy trang qua một máy chủ (GitHub Pages hoặc python3 -m http.server).');
        datNa(oCum, 1, false, true); datNa(cv, 1, true, true);
        boc.classList.add('hien');
        pha = 'xong'; oCum.classList.add('song'); batTuongTacVat();
        dungCot();
        for(var c0 = 0; c0 < oCot.length; c0++)
          goCot(oCot[c0], DATA.cot[c0].dong, itDong ? 0 : MAIN.in_ascii);
        return;
      }
      datNa(oCum, 0, false, true); datNa(cv, 0, true, true);
      boc.classList.add('hien');
      pha = 'in'; batDau = 0;
      requestAnimationFrame(vong);
      dungCot();
      for(var c1 = 0; c1 < oCot.length; c1++)
        goCot(oCot[c1], DATA.cot[c1].dong, itDong ? 0 : MAIN.in_ascii);
    },
    /* Báo cho phần chuyển cảnh biết lúc nào KHÔNG được hiểu cú vuốt là
       lệnh thoát: đang xem chi tiết, đang kéo hiện vật, hoặc đang cuộn thẻ. */
    khoa: function(){ return phongVat >= 0 || keoVat >= 0; },
    /* Cho phần cảm biến nghiêng gọi vào để vẽ lại khi máy đổi hướng */
    day: function(){ if(pha === 'xong') day(); },
    dong: function(){
      pha = 'nghi';
      hen.forEach(clearTimeout); hen = [];
      if(quay){ cancelAnimationFrame(quay); quay = null; }
      phongVat = -1; reVat = -1; keoVat = -1;
      /* CHỈ tắt hiển thị — mọi thứ đứng nguyên tại chỗ rồi mờ đi cùng nhau.
         Việc dọn dẹp để SAU khi đã mờ hẳn, nếu không thì các hiện vật sẽ
         nhảy về chỗ cũ ngay trước mắt người xem.                          */
      boc.classList.remove('hien');
      henDon = setTimeout(donDep, 620);
    }
  };
}

/* =========================================================================
   NGHIÊNG THEO CẢM BIẾN CỦA ĐIỆN THOẠI
   Máy tính dùng con trỏ để quyết định hướng nghiêng 3D; điện thoại không có
   con trỏ nên lấy luôn độ nghiêng thật của thiết bị. Giá trị được làm mượt
   rồi ghi vào MAY.x / MAY.y, và mọi nơi đang nghiêng 3D đều cộng thêm nó.
   ========================================================================= */
function batNghiengMay(){
  if(!NGHIENGMAY.bat || itDong) return;
  if(!mayCham) return;                     /* chỉ chạy trên thiết bị cảm ứng */
  if(typeof DeviceOrientationEvent === 'undefined') return;

  var day = NGHIENGMAY.goc_day || 30;
  var moc = NGHIENGMAY.moc_beta == null ? 50 : NGHIENGMAY.moc_beta;
  var muc = NGHIENGMAY.muc == null ? 0.6 : NGHIENGMAY.muc;
  var k   = NGHIENGMAY.muot || 0.14;

  function nhan(e){
    if(e.gamma == null && e.beta == null) return;
    MAY.co = true;
    /* gamma = nghiêng trái–phải · beta = ngả trước–sau */
    var gx = Math.max(-1, Math.min(1, (e.gamma || 0) / day)) * muc;
    var gy = Math.max(-1, Math.min(1, ((e.beta || 0) - moc) / day)) * muc;
    MAY.x += (gx - MAY.x) * k;
    MAY.y += (gy - MAY.y) * k;
    biDay();
    if(manHinh && manHinh.day) manHinh.day();
  }
  addEventListener('deviceorientation', nhan, { passive:true });

  /* iOS 13+ chỉ cấp quyền cảm biến sau một thao tác chạm của người xem */
  if(typeof DeviceOrientationEvent.requestPermission === 'function'){
    var xin = function(){
      removeEventListener('touchend', xin);
      try{
        DeviceOrientationEvent.requestPermission()
          .then(function(){}).catch(function(){});
      }catch(err){}
    };
    addEventListener('touchend', xin, { passive:true });
  }
}

/* =========================================================================
   VỆT CHUỘT PIXEL
   Mỗi khi con trỏ bước sang một ô lưới mới thì sinh một ô vuông mang chữ
   t · u · a · n, rồi ô đó tự mờ dần. Bỏ qua trên thiết bị cảm ứng và khi
   hệ điều hành đang bật chế độ giảm chuyển động.
   ========================================================================= */
function batVetChuot(){
  if(!PIXEL.bat || itDong) return;
  if(!matchMedia('(pointer: fine)').matches) return;

  var cv = document.createElement('canvas');
  cv.className = 'vet-chuot';
  cv.setAttribute('aria-hidden', 'true');
  document.body.appendChild(cv);

  var ctx = cv.getContext('2d');
  var chuoi = String(PIXEL.chu || 'tuan').split('');
  var vet = [], iChu = 0, xCu = -1, yCu = -1, dangChay = false;

  function doLaiCanvas(){
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    cv.width  = window.innerWidth  * dpr;
    cv.height = window.innerHeight * dpr;
    cv.style.width  = window.innerWidth  + 'px';
    cv.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  doLaiCanvas();
  addEventListener('resize', doLaiCanvas);

  addEventListener('mousemove', function(e){
    if(tatVetChuot) return;          /* trong Main Section thì không vẽ vệt */
    var S = PIXEL.o;
    var x = Math.floor(e.clientX / S) * S;
    var y = Math.floor(e.clientY / S) * S;
    if(x === xCu && y === yCu) return;          /* vẫn trong ô cũ thì bỏ qua */
    xCu = x; yCu = y;

    var k = iChu % chuoi.length; iChu++;
    vet.push({ x:x, y:y, ch:chuoi[k], cuoi: k === chuoi.length - 1, mo:1 });

    if(!dangChay){ dangChay = true; requestAnimationFrame(ve); }
  }, { passive:true });

  function ve(){
    var S = PIXEL.o, W = window.innerWidth, H = window.innerHeight;
    ctx.clearRect(0, 0, W, H);
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 ' + Math.round(S * 0.6) + 'px ui-monospace, Menlo, Consolas, monospace';

    for(var i = vet.length - 1; i >= 0; i--){
      var p = vet[i];
      ctx.globalAlpha = p.mo;
      ctx.fillStyle = p.cuoi ? PIXEL.mau_o_cuoi : PIXEL.mau_o;
      ctx.fillRect(p.x, p.y, S, S);
      ctx.fillStyle = PIXEL.mau_chu;
      ctx.fillText(p.ch, p.x + S/2, p.y + S/2 + 1);

      p.mo -= PIXEL.toc_do_mo;
      if(p.mo <= 0) vet.splice(i, 1);
    }
    ctx.globalAlpha = 1;

    /* Hết ô thì dừng vòng lặp cho đỡ tốn máy */
    if(vet.length) requestAnimationFrame(ve);
    else { dangChay = false; ctx.clearRect(0, 0, W, H); }
  }
}

/* =========================================================================
   6. KHỞI ĐỘNG
   ========================================================================= */
function veLai(){
  veHeroBi();
  veLuoi();
  /* Chữ đã bị hàm mã hoá thay bằng span — dựng lại cho sạch rồi bật lớp hiện */

}

document.fonts && document.fonts.ready.then(dongBoCum);

/* Hiện dần các phần tử hero sau khi đã đo đạc xong */
requestAnimationFrame(function(){

  });
  el('tuyenngon').classList.add('hien');
  setTimeout(function(){ maHoa(el('tuyenngon'), MAHOA.thoi_gian * 1.25); }, 260);
});

var hen;
addEventListener('resize', function(){ clearTimeout(hen); hen = setTimeout(veLai, 120); });
addEventListener('orientationchange', function(){ setTimeout(veLai, 260); });

})();
