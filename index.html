/* =========================================================================
   NỀN TẢNG
   ========================================================================= */
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

/* BẮT BUỘC: html phải có nền riêng, nếu không mix-blend-mode của lưới sẽ hỏng */
html{
  background:var(--giay); scroll-behavior:smooth;
  scrollbar-width:none;        /* Firefox */
  -ms-overflow-style:none;     /* Edge cũ  */
}
/* Chrome · Safari · Edge — ẩn thanh cuộn, vẫn cuộn bình thường */
html::-webkit-scrollbar, body::-webkit-scrollbar{ width:0; height:0; display:none; }

/* Khoá cuộn khi còn ở Hero — Hero đứng yên tuyệt đối cho tới khi cửa sổ nở.
   Chỉ khoá bằng overflow, KHÔNG chặn sự kiện lăn chuột / vuốt, nên thao tác
   cuộn vẫn được ghi nhận để mở cửa sổ. Nhờ vậy không bao giờ kẹt. */
body.khoa{ overflow:hidden; }

/* Tắt tính năng tự neo vị trí cuộn của trình duyệt, vì Hero co lại 0
   khi cửa sổ phủ kín và trình duyệt sẽ cố kéo giữ vị trí cũ. */
html, body{ overflow-anchor:none; }

body{
  background:var(--giay);
  isolation:isolate;              /* BẮT BUỘC: để lưới crosshair blend đúng */
  color:var(--muc);
  font-family:'BTDanta', 'Segoe UI', system-ui, sans-serif;
  font-weight:500;
  -webkit-font-smoothing:antialiased;
  overflow-x:hidden;
  min-height:100svh;
}

/* Chữ kiểu "máy" dùng cho toạ độ, số hiệu, terminal */
.may{
  font-family:ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;
  font-variant-numeric:tabular-nums;
  letter-spacing:.06em;
}

a{ color:inherit; text-decoration:none; }
img{ display:block; max-width:100%; }
:focus-visible{ outline:2px solid var(--do); outline-offset:3px; }
::selection{ background:var(--do); color:var(--giay); }

/* =========================================================================
   LỚP LƯỚI CROSSHAIR (giữ nguyên cơ chế từ file hiệu ứng gốc)
   ========================================================================= */
.luoi{
  position:fixed; inset:0; z-index:20;
  width:100%; height:100%;
  pointer-events:none;
  mix-blend-mode:difference;
}
.luoi svg{ display:block; width:100%; height:100%; shape-rendering:crispEdges; }

/* --- Tấm bì hồ sơ: nằm giữa khung, DƯỚI chữ và dưới cửa sổ ---
   Toàn bộ phép biến đổi do JS ghép chuỗi, gồm: dịch tâm → độ lệch khi kéo →
   phối cảnh → nghiêng 3D theo con trỏ → độ nghiêng cố định → phóng.       */
.hero-bi img{ width:100%; height:100%; object-fit:contain; display:block;
  -webkit-user-drag:none; }
.hero-bi{
  position:absolute; z-index:3;           /* cửa sổ 15, chữ ~auto → bì nằm dưới */
  display:block; pointer-events:auto; cursor:grab;
  opacity:0; transform-origin:50% 50%;
  transition:opacity 1s ease .2s;        /* hiện dần y như cửa sổ phần mềm */
  /* bóng đổ do JS đặt từng khung theo góc nghiêng */
  user-select:none; -webkit-user-drag:none;
  touch-action:none;
}
.hero-bi.hien{ opacity:var(--bi-mo,1); }
/* Xong màn chào thì bỏ độ trễ, để nghiêng theo con trỏ bám tay ngay */
.hero-bi.san{ transition:transform .34s cubic-bezier(.22,1,.28,1), opacity .5s ease; }
.hero-bi.keo{ transition:none; cursor:grabbing; }
body.da-phu .hero-bi{ opacity:0; transition-delay:0s; pointer-events:none; }

/* =========================================================================
   MAIN SECTION
   Khối này phủ kín màn hình khi cửa sổ phóng to xong. Nội dung mới cứ dựng
   vào trong #manHinh; class "hien" do phần chuyển cảnh tự bật/tắt.
   ========================================================================= */
/* Khi Main Section đã phủ kín, chặn bôi đen dính vào chữ terminal nằm dưới.
   Chỉ hai cột nhật ký và bảng chi tiết mới cho chọn chữ.                   */
body.da-phu .cuaso, body.da-phu .hero{
  user-select:none; -webkit-user-select:none;
}
.mh-tren, .hud.hien .hud-cot{
  pointer-events:auto; cursor:text;
  user-select:text; -webkit-user-select:text;
}

/* Khi chưa bật, Main Section phải BIẾN MẤT HẲN khỏi vùng nhận sự kiện —
   nếu chỉ để opacity:0 thì các lớp bên trong vẫn bắt chuột và vẫn kéo được
   ảnh, làm Hero bị khựng và kéo nhầm ảnh của Main Section.
   visibility đổi TRỄ đúng bằng thời gian mờ đi để không cắt mất hiệu ứng.  */
.man-hinh{
  position:fixed; inset:0; z-index:16;
  pointer-events:none; opacity:0; visibility:hidden;
  /* Bắt đầu ngay DƯỚI thanh IDEA.EXE và cắt gọn mọi thứ tràn ra. Nhờ vậy
     thanh tiêu đề không bao giờ bị hiện vật che, kể cả bóng đổ.
     (top do JS đặt vì chiều cao thanh thay đổi theo cỡ chữ)               */
  overflow:hidden;
  transition:opacity .55s ease, visibility 0s linear .55s;
}
.man-hinh.hien{ opacity:1; visibility:visible;
  transition:opacity .55s ease, visibility 0s linear 0s; }

/* --- Một phần ba trên: BẢNG ĐIỀU KHIỂN KIỂU MÀN HÌNH BIOS ---
   Ba tầng xếp dọc: dải trạng thái mảnh · thanh tab trong khung viền ·
   lưới các bảng dữ liệu. Toàn bộ chỉ dùng nét mảnh và chữ máy rất nhỏ,
   không có thanh tiêu đề giả hay chấm đèn.                              */
.mh-tren{
  position:absolute; left:0; right:0;
  display:flex; flex-direction:column; gap:7px;
  padding:10px var(--le);
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  letter-spacing:.01em; color:var(--mint); overflow:hidden;
}

/* Dải trạng thái trên cùng — các trường dàn đều hết bề ngang */
.bios-dau{
  flex:0 0 auto; display:flex; justify-content:space-between; gap:1em;
  font-size:clamp(7px,.7vw,10px); line-height:1.5;
  letter-spacing:.16em; text-transform:uppercase;
  color:rgba(140,199,196,.6); white-space:nowrap; overflow:hidden;
}
.bios-dau span:first-child{ color:var(--giay); }

/* Thanh tab nằm gọn trong một khung viền mảnh */
.bios-tab{
  flex:0 0 auto; display:flex; justify-content:space-between; gap:.5em;
  padding:.34em clamp(10px,1.8vw,30px);
  border:1px solid rgba(140,199,196,.34);
}
.bios-tab button{
  background:none; border:0; padding:.1em .15em; cursor:pointer;
  font:inherit; font-weight:700; font-size:clamp(10px,1.15vw,15px);
  line-height:1.2; letter-spacing:.07em; text-transform:uppercase;
  color:var(--mint); opacity:.72; white-space:nowrap;
  transition:color .18s ease, opacity .18s ease;
}
.bios-tab button:hover{ opacity:1; color:var(--giay); }
.bios-tab button.chon{ color:var(--do); opacity:1; }

/* Lưới các bảng dữ liệu — chia đều bề ngang, tự co theo cỡ máy */
.bios-luoi{
  flex:1 1 auto; min-height:0;
  display:grid; align-items:stretch; justify-content:stretch;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  gap:0 clamp(8px,1.4vw,22px);
  /* Rất nhỏ và rất dày — đây là chất của màn hình BIOS trong ảnh mẫu.
     Muốn dễ đọc hơn thì nâng số cuối; muốn dày hơn nữa thì hạ xuống.   */
  font-size:clamp(8px,.78vw,10.5px); line-height:1.34;
}
.bios-luoi .cot{
  overflow:hidden; min-width:0; display:flex; flex-direction:column;
  border:1px solid rgba(140,199,196,.3);
  background:rgba(4,9,10,.5);
  padding:.55em .7em .6em;
}
/* Nhãn chế độ ở góc trên trái, mờ hẳn so với phần thân */
.cot-nhan{
  flex:0 0 auto; margin-bottom:.55em;
  font-size:.82em; line-height:1.5; letter-spacing:.1em;
  text-transform:uppercase; color:rgba(140,199,196,.4);
  white-space:nowrap; overflow:hidden; text-overflow:clip;
}
.cot-than{ flex:1 1 auto; min-height:0; overflow:hidden; }

/* Mỗi dòng mở đầu bằng một tiếng lệnh lặp lại, tạo thành máng dọc bên trái.
   Dòng trống vẫn hiện tiếng lệnh — đúng như một tệp batch thật.          */
.mh-tren .dong{
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; opacity:.82;
  position:relative; padding-left:var(--pre-w, 3.5em); min-height:1.34em;
}
.mh-tren .dong::before{
  content:"ECHO";
  content:var(--pre,"ECHO");
  position:absolute; left:0; top:0;
  color:rgba(140,199,196,.32); letter-spacing:.05em;
}
.mh-tren .dong.sang{ color:var(--giay); opacity:1; }
/* Dòng trích dẫn tang vật — bấm được */
.mh-tren .dong.co-vat,
.mh-tren .dong.co-link{ cursor:pointer; opacity:.9;
  transition:color .18s ease, opacity .18s ease; }
.mh-tren .dong.co-vat:hover,
.mh-tren .dong.co-link:hover{ color:var(--giay); opacity:1; text-decoration:underline; }
.mh-tren .dong.co-vat.khoa:hover{ color:var(--do); text-decoration:none; }
.mh-tren .dong.loi{ color:var(--do); opacity:1; }
/* Đuôi con trỏ "|" nhấp nháy, luôn đứng cuối dòng đang gõ */
.mh-tren .go-tro{ color:var(--giay); font-weight:700;
  animation:nhay 1.05s steps(1) infinite; }

/* --- Hai phần ba dưới: chữ ASCII rồi hoá thành hiện vật --- */

.mh-tren{ z-index:1; }
.mh-duoi{ position:absolute; left:0; right:0; z-index:2; }
.man-hinh.dangXem .mh-duoi{ z-index:4; }   /* hiện vật nổi lên trên nền tối */
.mh-ascii, .mh-nhieu{ position:absolute; left:0; top:0; display:block; }
.mh-ascii{ z-index:1; }
.mh-nhieu{ z-index:2; }
.mh-cum{ position:absolute; inset:0; z-index:3; }

.cum-vat{
  position:absolute; transform-origin:50% 50%;
  transition:opacity .34s ease;      /* transform do JS lo từng khung */
}
.cum-vat img{
  width:100%; height:100%; object-fit:contain; display:block;
  pointer-events:none;                 /* sự kiện do thẻ bọc .cum-vat nhận */
  -webkit-user-drag:none; user-select:none; -webkit-user-select:none;
  /* bóng đổ do JS đặt từng khung theo góc nghiêng */
}
/* Trên cảm ứng: chặn trình duyệt hiểu nhầm thao tác kéo vật là cuộn trang */
.mh-cum.song .cum-vat{ pointer-events:auto; cursor:grab; touch-action:none; }

/* --- VÙNG CHẠM VÔ HÌNH quanh mỗi hiện vật (chỉ trên thiết bị cảm ứng) ---
   Nới rộng vùng bắt ngón tay cho đủ 44px mà không đụng gì tới hình ảnh.
   Độ nới do JS tính theo MAIN.cham_toi_thieu rồi đặt vào biến --cham.    */
@media (pointer:coarse){
  .mh-cum.song .cum-vat::before{
    content:''; position:absolute; display:block;
    inset:calc(var(--cham, 0px) * -1);
  }
}

/* --- LOÉ SÁNG KIỂU TRINH THÁM ---
   Hai lớp phủ nằm trong lòng hiện vật, được CẮT ĐÚNG THEO HÌNH của ảnh bằng
   mask, nên ánh sáng chỉ liếm trên bề mặt vật chứ không tràn ra ô vuông.
   .vat-loe  = quầng đèn pin bám theo con trỏ
   .vat-quet = vệt loé chéo quét qua một lần lúc vừa rê vào               */
.cum-vat > i, .hero-bi > i{
  position:absolute; inset:0; display:block; pointer-events:none;
  -webkit-mask-size:100% 100%; mask-size:100% 100%;
  -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat;
  -webkit-mask-position:center; mask-position:center;
  mix-blend-mode:screen; opacity:0;
}
.vat-loe{
  background:radial-gradient(circle at var(--sx,50%) var(--sy,50%),
    rgba(var(--loe-mau,255,246,246),.95) 0%,
    rgba(var(--loe-mau,255,246,246),.35) calc(var(--loe-bk,58%) * .45),
    rgba(var(--loe-mau,255,246,246),0)   var(--loe-bk,58%));
}
.vat-quet{
  background:linear-gradient(102deg,
    rgba(255,255,255,0) 40%, rgba(255,255,255,.9) 50%, rgba(255,255,255,0) 60%);
  background-size:280% 100%;
}
.cum-vat.loe-quet .vat-quet, .hero-bi.loe-quet .vat-quet{
  animation:vatQuet var(--quet-ms,620ms) cubic-bezier(.25,.6,.3,1) 1;
}
@keyframes vatQuet{
  0%  { opacity:0;  background-position:140% 0; }
  16% { opacity:1; }
  100%{ opacity:0; background-position:-40% 0; }
}
@media (prefers-reduced-motion:reduce){ .cum-vat > i, .hero-bi > i{ display:none; } }

/* --- DÒNG CODE QUÉT BỀ MẶT (dùng khi xem chi tiết) ---
   Một dải sáng chạy lên chạy xuống trên mặt vật, cắt đúng theo hình vật.
   Vị trí dải do JS đặt vào biến --qy.                                     */
.vat-scan{
  background:linear-gradient(to bottom,
    rgba(140,199,196,0)   0%,
    rgba(140,199,196,.30) 38%,
    rgba(255,255,255,.92) 50%,
    rgba(140,199,196,.30) 62%,
    rgba(140,199,196,0)   100%);
  background-size:100% 24%; background-repeat:no-repeat;
  background-position:0 var(--qy, -30%);
  opacity:0;
}
.mh-cum.song .cum-vat.xem-duoc{ cursor:zoom-in; }
.mh-cum.song .cum-vat.keo{ cursor:grabbing; }

/* --- Lớp xem chi tiết --- */
.xem-nen{
  position:absolute; inset:0; z-index:3;
  background:rgba(10,10,10,.74); backdrop-filter:blur(3px);
  opacity:0; pointer-events:none; transition:opacity .38s ease;
}
.xem-nen.hien{ opacity:1; pointer-events:auto; cursor:zoom-out; }
/* Trong lúc xem chi tiết, lớp nhiễu được đẩy lên TRÊN hiện vật để vẽ dòng
   code đang quét trên bề mặt vật.                                          */
.man-hinh.dangXem .mh-nhieu{ z-index:5; }

/* =========================================================================
   HUD TRÍCH XUẤT THÔNG TIN
   Vật nằm giữa màn hình, một dòng code quét lên xuống trên mặt nó, rồi các
   khối dữ liệu bung dần ra hai bên như đang được rút ra từ chính hiện vật.
   ========================================================================= */
.hud{
  position:absolute; inset:0; z-index:6; pointer-events:none;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  /* visibility:hidden là mấu chốt — chỉ hạ opacity thôi thì khối chữ vẫn
     nằm nguyên đó, vẫn bôi đen copy được và vẫn chặn thao tác kéo hiện
     vật đi ngang qua vùng của nó.                                        */
  opacity:0; visibility:hidden;
  transition:opacity .28s ease, visibility 0s linear .28s;
}
.hud.hien{ opacity:1; visibility:visible;
  transition:opacity .28s ease, visibility 0s linear 0s; }

/* Lớp mã lan ra từ hiện vật */
.hud-lan{ position:absolute; left:0; top:0; display:block; pointer-events:none; }

/* --- Đường nối từ hiện vật sang các khối --- */
.hud-day{ position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
.hud-day path{
  fill:none; stroke:var(--mint); stroke-width:1; opacity:.5;
  /* --dai do JS đặt bằng ĐỘ DÀI THẬT của đường (getTotalLength). Trước đây
     đặt đại một số rất lớn nên nét chỉ hiện ra ở đoạn chót, trông như bật
     lên chứ không phải được vẽ dần từ phía hiện vật ra.                  */
  stroke-dasharray:var(--dai,400); stroke-dashoffset:var(--dai,400);
  transition:stroke-dashoffset var(--ve,.68s) cubic-bezier(.25,.7,.3,1);
}
.hud.ra .hud-day path{ stroke-dashoffset:0; }
.hud-day circle{ fill:var(--do); opacity:0; transition:opacity .3s ease .45s; }
.hud.ra .hud-day circle{ opacity:.9; }

/* --- Khung ngắm bốn góc ôm lấy hiện vật --- */
.hud-khung{ position:absolute; }
.hud-khung i{
  position:absolute; width:clamp(12px,1.5vw,22px); height:clamp(12px,1.5vw,22px);
  display:block; border:1.5px solid var(--mint); opacity:0;
  transition:opacity .28s ease, transform .45s cubic-bezier(.2,.9,.25,1);
}
.hud-khung i:nth-child(1){ left:0;  top:0;    border-right:0; border-bottom:0;
  transform:translate(-16px,-16px); }
.hud-khung i:nth-child(2){ right:0; top:0;    border-left:0;  border-bottom:0;
  transform:translate(16px,-16px); }
.hud-khung i:nth-child(3){ left:0;  bottom:0; border-right:0; border-top:0;
  transform:translate(-16px,16px); }
.hud-khung i:nth-child(4){ right:0; bottom:0; border-left:0;  border-top:0;
  transform:translate(16px,16px); }
.hud.ra-khung .hud-khung i{ opacity:.85; transform:none; }
.hud-khung b{
  position:absolute; left:50%; top:-1.9em; transform:translateX(-50%);
  font-size:clamp(7px,.7vw,9px); letter-spacing:.24em; font-weight:400;
  color:var(--do); white-space:nowrap; opacity:0; transition:opacity .3s ease .2s;
}
.hud.ra-khung .hud-khung b{ opacity:.9; }

/* --- Hai cột dữ liệu --- */
.hud-cot{
  position:absolute; top:50%; transform:translateY(-50%);
  width:min(25vw, 330px); max-height:86%;
  display:flex; flex-direction:column; gap:9px;
  overflow-y:auto; scrollbar-width:none; pointer-events:none;
}
.hud.hien .hud-cot{ pointer-events:auto; }
.hud-cot::-webkit-scrollbar{ display:none; }
.hud-trai{ left:var(--le); }
.hud-phai{ right:var(--le); width:min(31vw, 430px); }

.hud-o{
  border:1px solid rgba(140,199,196,.34);
  background:rgba(8,14,16,.72);
  -webkit-backdrop-filter:blur(2px); backdrop-filter:blur(2px);
  padding:clamp(8px,.85vw,13px) clamp(10px,1vw,16px);
  color:var(--mint); flex:0 0 auto;
  opacity:0;
  transition:opacity .3s ease, transform .44s cubic-bezier(.2,.85,.25,1),
             clip-path .48s cubic-bezier(.2,.85,.25,1);
}
/* HƯỚNG MỌC: khối bắt đầu ở MÉP TRONG — mép quay về phía hiện vật — rồi nở
   dần ra phía ngoài. Cột trái mở từ phải sang trái, cột phải thì ngược lại.
   Nhờ vậy mọi thứ đều toả ra từ giữa màn hình chứ không trượt từ rìa vào. */
.hud-trai .hud-o{
  border-left:2px solid var(--do);
  transform:translateX(26px); clip-path:inset(0 0 0 100%);
}
.hud-phai .hud-o{
  border-right:2px solid var(--do);
  transform:translateX(-26px); clip-path:inset(0 100% 0 0);
}
.hud-o.ra{ opacity:1; transform:none; clip-path:inset(0 0 0 0); }

.hud-o .nhan{
  display:flex; align-items:center; gap:.6em;
  font-size:clamp(8px,.72vw,10px); letter-spacing:.22em; text-transform:uppercase;
  color:var(--do); margin-bottom:.6em; white-space:nowrap;
}
.hud-o .nhan::after{ content:''; flex:1 1 auto; height:1px;
  background:rgba(219,26,26,.32); }
.hud-ma{ font-size:clamp(9px,.8vw,11px); letter-spacing:.2em; color:var(--do);
  font-weight:700; margin-bottom:.2em; }
.hud-ten{
  font-family:'BTDanta',system-ui,sans-serif; font-weight:800;
  font-size:clamp(18px,2.1vw,32px); line-height:1.02; color:var(--giay);
  letter-spacing:-.015em; text-transform:uppercase; margin:0;
}

/* --- CÁC DÒNG DỮ LIỆU trong khối HUD --- */
.the-truong{ display:flex; align-items:baseline; gap:.5em;
  font-size:clamp(9px,.85vw,12px); line-height:1.95; }
.the-truong b{ font-weight:400; opacity:.6; letter-spacing:.14em;
  text-transform:uppercase; white-space:nowrap; }
.the-truong i{ flex:1 1 auto; border-bottom:1px dotted rgba(140,199,196,.3);
  transform:translateY(-.25em); font-style:normal; }
.the-truong span{ color:var(--giay); white-space:nowrap; }
.the-khoi .than{
  font-size:clamp(10px,.95vw,13px); line-height:1.62; color:var(--mint); opacity:.9;
}

@media (max-width:760px){
  /* Điện thoại: ba cột xếp NGANG, vuốt sang để đọc — tránh hẳn việc chồng
     lên nhau khi chiều cao vùng trên không đủ, và không tranh vuốt dọc
     với thao tác thoát Main Section.                                      */
  .mh-tren{ padding:8px var(--le); gap:5px; }
  .bios-dau{ font-size:7px; letter-spacing:.1em; }
  .bios-dau span.phu{ display:none; }   /* bớt trường phụ cho vừa bề ngang */
  .bios-tab{ padding:.38em 10px; }
  .bios-tab button{ font-size:11px; letter-spacing:.04em; }
  .bios-luoi{
    display:flex; gap:0;
    overflow-x:auto; overflow-y:hidden;
    scroll-snap-type:x mandatory;
    -webkit-overflow-scrolling:touch;
    touch-action:pan-x;
    overscroll-behavior-x:contain;
    scrollbar-width:none;
    font-size:9.5px; line-height:1.5;
  }
  .bios-luoi::-webkit-scrollbar{ display:none; }
  .bios-luoi .cot{
    flex:0 0 88%; scroll-snap-align:start; margin-right:8px;
  }
  /* Điện thoại: gộp về MỘT cột dữ liệu nằm dưới, từng khối vẫn bung lần lượt
     và so le trái–phải nên vẫn giữ cảm giác đang được rút ra hai bên.      */
  .hud-trai{ display:none; }
  .hud-phai{
    left:var(--le); right:var(--le); width:auto;
    top:auto; bottom:2.5%; transform:none; max-height:44svh;
  }
  /* Điện thoại: hiện vật nằm PHÍA TRÊN, nên khối nở từ mép trên xuống */
  .hud-phai .hud-o{
    border-right:0; border-left:2px solid var(--do);
    transform:translateY(-18px); clip-path:inset(0 0 100% 0);
  }
  .hud-phai .hud-o.le-phai{ border-left:0; border-right:2px solid var(--do); }
  .hud-phai .hud-o.ra{ transform:none; clip-path:inset(0 0 0 0); }
  .hud-ten{ font-size:clamp(17px,5.4vw,26px); }
  .hud-khung i{ width:11px; height:11px; }
}

/* =========================================================================
   VỆT CHUỘT PIXEL — nằm trên nội dung, dưới lưới crosshair
   ========================================================================= */
.vet-chuot{ position:fixed; inset:0; z-index:19; pointer-events:none; }

/* =========================================================================
   HERO
   ========================================================================= */
.hero{ position:relative; height:100svh; min-height:560px; overflow:hidden; }
/* Cửa sổ đã phủ kín màn hình → Hero thu về 0, Main Section chiếm chỗ */
body.da-phu .hero{ height:0; min-height:0; }

/* --- Ba cụm chữ neo theo toạ độ lưới (vị trí do JS tính) --- */
.cum{ position:absolute; max-width:min(30vw, 300px); pointer-events:none; opacity:0;
      transition:opacity .4s ease; }
.cum.hien{ opacity:1; }
/* Toạ độ nằm DƯỚI chữ */
.cum-toado{ font-size:9px; color:var(--mint); display:block; margin-top:7px; font-weight:700; }
.cum-chu{
  font-weight:800; font-size:clamp(13px, 1.35vw, 19px); line-height:1.12;
  text-transform:uppercase; letter-spacing:-.01em;
}
.cum:nth-child(2) .cum-chu{ color:var(--do); }


/* --- Câu tuyên ngôn góc dưới trái --- */
.tuyenngon{
  transition:opacity .5s ease;
  position:absolute; bottom:clamp(28px, 7vh, 76px);
  max-width:min(94vw, 19ch);
  font-weight:800; font-size:clamp(38px, 7.2vw, 104px);
  line-height:.92; letter-spacing:-.035em; text-transform:uppercase;
  opacity:0;
}
.tuyenngon.hien{ opacity:1; }

/* Chữ đang ở dạng MÃ HOÁ — màu khác hẳn để nổi bật, giải dần thành chữ thật */
.mh-ma{ color:var(--do); opacity:.92; }
.tuyenngon .mh-ma{ opacity:.5; }
.tuyenngon .tn-dong{ display:block; }
.tuyenngon b{ font-weight:800; color:var(--do); }

/* =========================================================================
   CỬA SỔ PHẦN MỀM (4:3, kéo thả được)
   ========================================================================= */
.cuaso{
  --gan:1;                 /* hệ số phóng khi con trỏ lại gần, do JS đặt */
  position:absolute; z-index:15;      /* neo vào Hero, không trôi theo màn hình */
  width:min(46vw, 560px); aspect-ratio:4/3;
  background:var(--giay);
  border:1px solid var(--muc);
  box-shadow:0 22px 60px -28px rgba(18,48,57,.55);
  display:flex; flex-direction:column;
  touch-action:none;
  opacity:0; transition:opacity .7s .35s ease, box-shadow .25s ease;
  transform:scale(var(--gan,1)); transform-origin:50% 50%;
}
.cuaso.hien{ opacity:1; }
/* Đã phóng to phủ kín thì bỏ hệ số này đi */
.cuaso.phongto{ transform:none; }
.cuaso.dangkeo{ box-shadow:0 34px 80px -30px rgba(18,48,57,.7); }
/* Khi phóng to: thoát khỏi Hero, phủ kín màn hình, kích thước do JS đặt */
.cuaso.phongto{
  position:fixed; aspect-ratio:auto; box-shadow:none;
}

/* Đã phủ kín màn hình: thanh tiêu đề trở thành thanh của cả trang */
.cuaso.phu-kin .cs-thanh{
  position:fixed; top:0; left:0; right:0; z-index:18;
  background:var(--giay);
}
/* Thanh tiêu đề rời khỏi dòng chảy khi phóng kín → phải chừa lại đúng chiều
   cao của nó, nếu không khung video đột ngột cao thêm và video giật lên. */
.cuaso.phu-kin{ padding-top:var(--cao-thanh, 34px); }

/* Khung chứa màn hình + lớp phủ làm tối */
/* Video nền trong cửa sổ. object-fit:cover nên mọi tỉ lệ đều phủ kín khung,
   không bao giờ để lộ viền đen.                                          */
.cs-than{ z-index:1; }
.cs-video{
  position:absolute; inset:0; width:100%; height:100%; z-index:2;
  object-fit:cover; display:block;
  opacity:0; transition:opacity .9s ease;
  pointer-events:none;
}
.cs-video.hien{ opacity:var(--vid-mo,1); }
/* THANH TẢI kiểu terminal: một dãy ô vuông ASCII, căn giữa cửa sổ.
   Chữ nhật ký vẫn căn trái ở trên, chỉ riêng thanh này nằm giữa.          */
.tai-boc{
  position:absolute; left:50%; bottom:12%;
  transform:translateX(-50%);
  width:max-content; max-width:86%;
  text-align:center;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
}
/* Khối tải nằm im cho tới khi màn terminal gõ xong */
.tai-boc.cho{ opacity:0; }
/* Dòng "Loading... Idea" — CĂN GIỮA, nằm ngay trên thanh tiến trình */
.tai-chinh{
  color:var(--giay); letter-spacing:.02em; margin-bottom:.75em;
  font-size:clamp(10px,1.15vw,15px); line-height:1.3; white-space:nowrap;
}
.tai-o{
  font-size:clamp(9px,1.25vw,15px); line-height:1.2;
  color:var(--mint); white-space:nowrap; letter-spacing:.04em;
}
.tai-o b{ color:var(--giay); font-weight:400; }
.tai-so{
  margin-top:.7em; font-size:clamp(8px,.85vw,11px);
  letter-spacing:.24em; color:rgba(140,199,196,.6); text-transform:uppercase;
}
/* Tải xong thì cả màn terminal biến mất hẳn, nhường chỗ cho video */
.cs-than{ transition:opacity .55s ease; }
.cs-than.xong{ opacity:0; pointer-events:none; }
.tai-boc{ transition:opacity .5s ease; }

/* --- NÚT ICON trên thanh tiêu đề (tiếng · phóng to/thu nhỏ) ---
   Cả hai nút đều nằm phía BÊN PHẢI, đẩy sang bởi .cs-toado{margin-left:auto} */
.cs-nut{
  display:inline-flex; align-items:center; justify-content:center;
  width:20px; height:18px; padding:0; flex:0 0 auto; line-height:0;
  background:transparent; color:var(--muc-nhat); cursor:pointer;
  border:1px solid rgba(18,48,57,.28); border-radius:2px;
  transition:color .18s ease, border-color .18s ease, background .18s ease;
}
.cs-nut:hover{ color:var(--do); border-color:var(--do); background:rgba(219,26,26,.06); }
.cs-nut svg{ display:block; width:12px; height:12px; }

.cs-khung{ position:relative; flex:1 1 auto; overflow:hidden; background:var(--den); }
.cs-phu{
  position:absolute; inset:0; background:var(--den); z-index:4;
  opacity:0; pointer-events:none;
}
/* Vùng bắt thao tác bấm — trong suốt, luôn nằm trên cùng trong khung cửa sổ */
.cs-bam{ position:absolute; inset:0; z-index:5; }
body.khoa .cs-bam{ cursor:pointer; }
.cuaso.phu-kin .cs-bam{ pointer-events:none; }

.cs-thanh{
  display:flex; align-items:center; gap:8px;
  padding:8px 10px; border-bottom:1px solid var(--muc);
  cursor:grab; user-select:none; flex:0 0 auto;
}
.cuaso.dangkeo .cs-thanh{ cursor:grabbing; }

/* LOGO trên thanh tiêu đề — thay ảnh ở LOGO.nguon trong khu vực chỉnh sửa */
.cs-logo{
  height:14px; width:auto; flex:0 0 auto; display:block;
  object-fit:contain; -webkit-user-drag:none; user-select:none;
}
/* Đang chờ thao tác mở → logo thở nhẹ. Xoá dòng dưới nếu không muốn. */
body.khoa .cs-logo{ animation:tho 2.1s ease-in-out infinite; }
/* Bấm vào màn hình cửa sổ cũng mở được — lối thoát dự phòng nếu chuột không lăn */

@keyframes tho{ 0%,100%{ opacity:1 } 50%{ opacity:.28 } }
.cs-ten{ font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
.cs-toado{ font-size:10px; color:var(--muc-nhat); margin-left:auto; white-space:nowrap; }
/* Nút phóng to / thu nhỏ — LUÔN hiện, icon tự đổi theo trạng thái cửa sổ */
.cs-than{ position:absolute; inset:0; background:var(--den); }
/* Màn hình dự phòng kiểu terminal */
.terminal{
  position:absolute; inset:0; background:var(--den);
  display:flex; flex-direction:column; justify-content:flex-start;  /* căn từ trên xuống */
  padding:clamp(12px,2.4vw,26px); gap:0;
  font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  /* CỠ CHỮ TERMINAL — nhỏ lại cho ra dáng cửa sổ dòng lệnh thật */
  font-size:clamp(9px,1vw,13px); line-height:1.7; color:var(--mint);
  letter-spacing:.01em;
}
.terminal .mo{ color:rgba(140,199,196,.42); }
.terminal .chinh{ color:var(--giay); }
.terminal .con-tro, .tai-chinh .con-tro{
  display:inline-block; width:.6em; height:1em; background:var(--mint);
  vertical-align:-.15em; margin-left:.25em; animation:nhay 1.05s steps(1) infinite;
}
@keyframes nhay{ 0%,50%{opacity:1} 51%,100%{opacity:0} }

/* =========================================================================
   MAIN SECTION — chính là lòng cửa sổ phần mềm sau khi phóng to
   ========================================================================= */
.main{
  position:relative; z-index:17;
  padding:clamp(74px,13vh,140px) var(--le) 0;
  min-height:100svh;
  color:var(--giay);
  pointer-events:none;             /* vùng trống không chắn thanh tiêu đề cửa sổ */
}


/* =========================================================================
   RESPONSIVE
   ========================================================================= */
@media (max-width:760px){
  /* Cửa sổ còn nhỏ trên điện thoại thì bỏ toạ độ đi cho thanh tiêu đề đủ chỗ */
  .cuaso:not(.phu-kin) .cs-toado{ display:none; }
  .cum{ max-width:none; }
  .cum-chu{ font-size:12px; }
  .cuaso{ width:min(80vw, 340px); }
  .tuyenngon{ font-size:clamp(27px,8.4vw,46px); max-width:13ch; bottom:clamp(24px,4.5vh,44px); }
  .cum-toado{ font-size:8px; margin-top:5px; }
}

/* Tôn trọng thiết lập giảm chuyển động của hệ điều hành */
@media (prefers-reduced-motion:reduce){
  html{ scroll-behavior:auto; }
  *,*::before,*::after{ animation-duration:.01ms !important; animation-iteration-count:1 !important;
    transition-duration:.01ms !important; }
  .cum,.tuyenngon{ opacity:1; }
}

/* ---------- Tiện ích chữ ---------- */
function thoat(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
/* **chữ** → in đậm ; *chữ* → tô đỏ */
function danh(s){
  return thoat(s)
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g, '<b>$1</b>');
}
function so4(n){ n = Math.max(0, Math.round(n)); return ('0000'+n).slice(-4); }

var TOADO = { xs:[], ys:[], W:0, H:0 };

var chan = function(n){ return Math.round(n) + 0.5; };

function catKhuc(tong, tam, khe){
  var nua = khe/2, khuc = [], moc = 0;
  tam.slice().sort(function(a,b){ return a-b; }).forEach(function(t){
    if(t - nua > moc) khuc.push([moc, t - nua]);
    moc = t + nua;
  });
  if(moc < tong) khuc.push([moc, tong]);
  return khuc;
}

function veLuoi(){
  var boc = $('.luoi');

  /* Lề nội dung toàn trang luôn khớp với đường kẻ dọc ngoài cùng */

  var mauDuong = 'rgba(' + GRID.mau + ', ' + GRID.mo_duong + ')';
  var mauCong  = 'rgb(' + GRID.mau + ')';
  var W = window.innerWidth, H = window.innerHeight;

  var xs = [], nd = Math.max(2, cf.so_duong_doc), i;
  for(i = 0; i < nd; i++) xs.push(chan(cf.le + i * (W - cf.le*2) / (nd - 1)));

  var ys = [], nn = Math.max(1, cf.so_duong_ngang);
  for(i = 1; i <= nn; i++) ys.push(chan(H * i / (nn + 1)));

  var dDoc = '';
  xs.forEach(function(x){
    catKhuc(H, ys, cf.khe_ho).forEach(function(k){ dDoc += 'M' + x + ' ' + k[0] + 'V' + k[1]; });
  });

  var dNgang = '';
  ys.forEach(function(y){
    catKhuc(W, xs, cf.khe_ho).forEach(function(k){ dNgang += 'M' + k[0] + ' ' + y + 'H' + k[1]; });
  });

  var dCong = '', nua = cf.co_dau_cong/2;
  xs.forEach(function(x){ ys.forEach(function(y){
    dCong += 'M' + x + ' ' + (y-nua) + 'V' + (y+nua) + 'M' + (x-nua) + ' ' + y + 'H' + (x+nua);
  }); });

  boc.innerHTML =
    '<svg viewBox="0 0 ' + W + ' ' + H + '" fill="none" xmlns="http://www.w3.org/2000/svg">' +
    '<path d="' + dDoc   + '" stroke="' + mauDuong + '" stroke-width="' + GRID.do_day + '" fill="none"/>' +
    '<path d="' + dNgang + '" stroke="' + mauDuong + '" stroke-width="' + GRID.do_day + '" fill="none"/>' +
    '<path d="' + dCong  + '" stroke="' + mauCong  + '" stroke-width="' + GRID.do_day +

  TOADO = { xs:xs, ys:ys, W:W, H:H };
}

  v.setAttribute('playsinline', '');
  v.style.setProperty('--vid-mo', String(VIDEO.mo_hero));

  var san = false, hong = false, xongRoi = false;
  v.addEventListener('canplaythrough', function(){ san = true; });
  v.addEventListener('loadeddata',     function(){ san = true; });
  v.addEventListener('error', function(){ hong = true; }, true);

  var t0 = performance.now(), cho = itDong ? 1 : (VIDEO.cho || 1400);
  var SO_O = VIDEO.so_o || 24;
  (function nhip(){
    var oo = el('taiO'), so = el('taiSo'), boc = el('taiBoc');
    if(hong){        /* không có file video → giữ nguyên màn terminal */
      /* Chỉ giấu thanh tiến trình, VẪN giữ dòng "Loading... Idea" ở giữa */

    /* Chờ màn terminal gõ xong đã, rồi mới bắt đầu đếm giờ nạp luồng */
    if(!termXong){ t0 = performance.now(); requestAnimationFrame(nhip); return; }
    /* Chạy tới 92% theo thời gian, chỉ nhảy nốt 100% khi video thật sự sẵn sàng */
    var p = Math.min(0.92, (performance.now() - t0) / cho);
    if(san) p = Math.min(1, Math.max(p, (performance.now() - t0) / cho));
    if(san && p >= 0.92) p = 1;
    if(oo){
      var day = Math.round(p * SO_O), t = '';
      for(var q = 0; q < SO_O; q++) t += (q < day ? '\u2588' : '\u2591');
      oo.innerHTML = '[<b>' + t + '</b>]';
    }
    if(so) so.textContent = 'nạp luồng · ' + (p * 100).toFixed(0) + '%';
    if(p < 1){ requestAnimationFrame(nhip); return; }
    if(xongRoi) return;
    xongRoi = true;
    if(than) than.classList.add('xong');   /* màn terminal biến mất hẳn */
    var bocT = el('taiBoc'); if(bocT) bocT.style.opacity = '0';

/* =========================================================================
   MÃ HOÁ CHỮ
   Mỗi ô chữ tách thành hai nhịp: phần ĐÃ GIẢI (chữ thật) và phần CÒN MÃ
   (ký tự ngẫu nhiên, màu đỏ). Ranh giới giữa hai phần chạy từ trái sang
   phải cho tới khi giải hết.
   ========================================================================= */
function maHoa(goc, thoiGian){
  if(!goc || !MAHOA.bat || itDong) return;
  var ds = [];
  (function di(n){
    for(var i = 0; i < n.childNodes.length; i++){
      var c = n.childNodes[i];
      if(c.nodeType === 3){ if(c.nodeValue) ds.push({ node:c, chu:c.nodeValue }); }
      else if(c.nodeType === 1 && c.className !== 'mh-ro' && c.className !== 'mh-ma') di(c);
    }
  })(goc);
  if(!ds.length) return;

  var tong = 0, i;
  for(i = 0; i < ds.length; i++){
    var d = ds[i], cha = d.node.parentNode;
    var a = document.createElement('span'); a.className = 'mh-ro';
    var b = document.createElement('span'); b.className = 'mh-ma';
    cha.insertBefore(a, d.node); cha.insertBefore(b, d.node);
    cha.removeChild(d.node);
    d.a = a; d.b = b; d.n = d.chu.length; tong += d.n;
  }

  var kho = String(MAHOA.kho || '#'), bd = -1, khung = 0;
  function ngau(mau){
    var s = '';
    for(var k = 0; k < mau.length; k++){
      var c = mau.charAt(k);
      s += (c === ' ' || c === '\n') ? c : kho.charAt((Math.random() * kho.length) | 0);
    }
    return s;
  }
  (function buoc(t){
    if(bd < 0) bd = t;
    var p = Math.min(1, (t - bd) / Math.max(1, thoiGian || 900));
    var truoc = p * tong, da = 0, doi = (++khung % (MAHOA.nhip || 2)) === 0;
    for(var i = 0; i < ds.length; i++){
      var d = ds[i];
      var xong = Math.max(0, Math.min(d.n, Math.round(truoc - da)));
      d.a.textContent = d.chu.slice(0, xong);
      if(xong < d.n){
        if(doi || d._m == null) d._m = ngau(d.chu.slice(xong));
        d.b.textContent = d._m;
      } else if(d.b.textContent) d.b.textContent = '';
      da += d.n;
    }
    if(p < 1) requestAnimationFrame(buoc);
    else for(var j = 0; j < ds.length; j++){
      ds[j].a.textContent = ds[j].chu; ds[j].b.textContent = '';
    }
  })(performance.now());
}

/* Ghép chuỗi transform. Giữ nguyên thứ tự: dịch → kéo → phối cảnh →
   nghiêng 3D → độ nghiêng cố định → phóng. */
function datBi(ngay){
  var e = el('heroBi'); if(!e) return;
  var vao = e.classList.contains('hien');
  var ti  = 1 + (HEROBI.phong || 0) * biTT.manh;   /* chỉ mờ dần, không trôi vào */
  /* Nghiêng theo con trỏ (máy tính) CỘNG nghiêng theo cảm biến (điện thoại) */
  var gB  =  (biTT.mx * biTT.manh + MAY.x) * (HEROBI.goc_3d || 0);
  var gA  = -(biTT.my * biTT.manh + MAY.y) * (HEROBI.goc_3d || 0);
  /* nghiêng theo hướng kéo */
  var gh2 = Math.max(-1, Math.min(1, (biTT.vx || 0) / 26));
  var gv2 = Math.max(-1, Math.min(1, (biTT.vy || 0) / 26));
  var lac2 = -gh2 * (HEROBI.keo_lac || 10);
  gB +=  gh2 * (HEROBI.keo_nghieng || 9);
  gA += -gv2 * (HEROBI.keo_nghieng || 9);
  e.style.transform =
    'translate(-50%,-50%) translate(' + biTT.dx.toFixed(1) + 'px,' + biTT.dy.toFixed(1) + 'px) ' +
    'perspective(' + (HEROBI.chieu_sau || 1100) + 'px) ' +
    'rotateX(' + gA.toFixed(2) + 'deg) rotateY(' + gB.toFixed(2) + 'deg) ' +
    'rotate(' + ((HEROBI.goc || 0) + lac2).toFixed(2) + 'deg) scale(' + ti.toFixed(4) + ')';

  /* BÓNG ĐỔ chạy ngược chiều nghiêng — nghiêng phải thì bóng dạt sang trái */
  var nhac = biTT.keo ? 1 : biTT.manh;
  var bx = -biTT.mx * (HEROBI.bong_lech || 26);
  var by = (HEROBI.bong_cao || 24) + (1 - biTT.my) * (HEROBI.bong_lech || 26) * 0.5
         + nhac * 14;
  var nhoe = (HEROBI.bong_nhoe || 40) + nhac * 18;

  /* VIỀN SÁNG ôm mép tấm bì, ghép NỐI TIẾP sau bóng đổ nên hai thứ chồng
     lên nhau chứ không cái nào đè cái nào.                                */
  var mLoe = biTT.manh || 0;
  var vien = (LOE.bat && LOE.vien)
    ? ' drop-shadow(0 0 ' + ((LOE.vien_nhoe || 14) * mLoe).toFixed(1) + 'px rgba(' +
      (LOE.mau || '255, 246, 246') + ',' + ((LOE.vien_dam || 0.45) * mLoe).toFixed(3) + '))'
    : '';
  e.style.filter = 'drop-shadow(' + bx.toFixed(1) + 'px ' + by.toFixed(1) + 'px ' +
                   nhoe.toFixed(0) + 'px rgba(18,48,57,' + (0.28 + nhac * 0.1).toFixed(2) + '))' +
                   vien;

  /* QUẦNG ĐÈN PIN bám theo con trỏ, cắt theo hình tấm bì */
  if(e._loe){
    e._loe.style.opacity = (mLoe * (LOE.do_sang == null ? 0.5 : LOE.do_sang)).toFixed(3);
    e._loe.style.setProperty('--sx', (50 + biTT.mx * 45).toFixed(1) + '%');
    e._loe.style.setProperty('--sy', (50 + biTT.my * 45).toFixed(1) + '%');
  }


}

var biMayCu = { x:0, y:0 };
function biChay(){
  var xong = Math.abs(biTT.mx - biTT.ox) < 0.002 && Math.abs(biTT.my - biTT.oy) < 0.002
             && Math.abs(biTT.manh - (biTT.re ? 1 : 0)) < 0.002
             && Math.abs(biTT.vx) < 0.03 && Math.abs(biTT.vy) < 0.03;
  /* Máy vừa nghiêng thì phải vẽ tiếp, dù mọi thứ khác đã đứng yên */
  if(Math.abs(MAY.x - biMayCu.x) > 0.0015 || Math.abs(MAY.y - biMayCu.y) > 0.0015) xong = false;
  biMayCu.x = MAY.x; biMayCu.y = MAY.y;
  var k = HEROBI.muot || 0.18;
  if(!biTT.keo){ biTT.vx *= 0.86; biTT.vy *= 0.86;
    if(Math.abs(biTT.vx) < 0.02) biTT.vx = 0;
    if(Math.abs(biTT.vy) < 0.02) biTT.vy = 0; }
  biTT.mx += (biTT.ox - biTT.mx) * k;
  biTT.my += (biTT.oy - biTT.my) * k;
  biTT.manh += ((biTT.re ? 1 : 0) - biTT.manh) * k;
  datBi(false);
  if(xong){ biQuay = null; return; }
  biQuay = requestAnimationFrame(biChay);
}
function biDay(){ if(!biQuay) biQuay = requestAnimationFrame(biChay); }

function batHeroBi(){
  var e = el('heroBi'); if(!e) return;

  /* --- nghiêng theo toạ độ con trỏ --- */
  e.addEventListener('pointerenter', function(){
    /* Vệt loé chéo quét qua một lần, giống hệt hiện vật ở Main Section */
    if(e._quet){
      e.classList.remove('loe-quet');
      void e.offsetWidth;
      e.classList.add('loe-quet');
    }
    if(!HEROBI.nghieng) return; biTT.re = true; biDay();
  });
  e.addEventListener('pointerleave', function(){
    biTT.re = false; biDay();   /* quầng sáng đứng yên tại chỗ rồi mờ đi */
  });
  addEventListener('pointermove', function(ev){
    if(!biTT.re && !biTT.keo) return;
    if(biTT.re){
      biTT.ox = Math.max(-1, Math.min(1, (ev.clientX - biTam.x - biTT.dx) / (biTam.w / 2)));
      biTT.oy = Math.max(-1, Math.min(1, (ev.clientY - biTam.y - biTT.dy) / (biTam.h / 2)));
      biDay();
    }
  }, { passive:true });

  /* --- kéo thả --- */
  var x0 = 0, y0 = 0, dx0 = 0, dy0 = 0;
  e.addEventListener('pointerdown', function(ev){
    if(!HEROBI.keo_tha || trangThai !== 'hero') return;
    biTT.keo = true; dangKeoBi = true;
    x0 = ev.clientX; y0 = ev.clientY; dx0 = biTT.dx; dy0 = biTT.dy;
    e.classList.add('keo');
    try{ e.setPointerCapture(ev.pointerId); }catch(err){}
    ev.preventDefault();
  });
  e.addEventListener('pointermove', function(ev){
    if(!biTT.keo) return;
    /* tốc độ kéo → lắc và ngả vật theo hướng đang bị lôi đi */
    biTT.vx += ((ev.clientX - (biTT._px == null ? ev.clientX : biTT._px)) - biTT.vx) * 0.35;
    biTT.vy += ((ev.clientY - (biTT._py == null ? ev.clientY : biTT._py)) - biTT.vy) * 0.35;
    biTT._px = ev.clientX; biTT._py = ev.clientY;
    var gh = HEROBI.gioi_han || 0.4;
    var mx = window.innerWidth * gh, my = window.innerHeight * gh;
    biTT.dx = Math.max(-mx, Math.min(mx, dx0 + ev.clientX - x0));
    biTT.dy = Math.max(-my, Math.min(my, dy0 + ev.clientY - y0));
    datBi(true);
    ev.preventDefault();
  });
  function nha(){
    if(!biTT.keo) return;
    biTT.keo = false; biTT._px = null; biTT._py = null; e.classList.remove('keo');
    setTimeout(function(){ dangKeoBi = false; }, 60);
    biDay();
  }
  e.addEventListener('pointerup', nha);
  e.addEventListener('pointercancel', nha);
}

/* ---------- Đặt vị trí & kéo thả ---------- */
var viTri = { x:0, y:0 }, daKeo = false;

/* Vị trí cửa sổ tính theo khung Hero — cuộn trang thì cửa sổ đứng yên tại chỗ */
/* Con trỏ lại gần cửa sổ thì nó nhích to ra một chút rồi thu về khi đi xa */
var ganTT = { muc:0, hien:0, quay:null };
function batGanCuaSo(){
  if(!GANCUASO.bat) return;
  addEventListener('pointermove', function(e){
    if(trangThai !== 'hero'){ ganTT.muc = 0; ganDay(); return; }
    var r = cuaso.getBoundingClientRect(), v = GANCUASO.vung || 140;
    var dx = Math.max(r.left - e.clientX, 0, e.clientX - r.right);
    var dy = Math.max(r.top - e.clientY, 0, e.clientY - r.bottom);
    var d  = Math.sqrt(dx*dx + dy*dy);
    ganTT.muc = Math.max(0, Math.min(1, 1 - d / v));
    ganDay();
  }, { passive:true });
  addEventListener('pointerleave', function(){ ganTT.muc = 0; ganDay(); }, { passive:true });
}
function ganDay(){ if(!ganTT.quay) ganTT.quay = requestAnimationFrame(ganChay); }
function ganChay(){
  var k = GANCUASO.muot || 0.14;
  var yen = Math.abs(ganTT.hien - ganTT.muc) < 0.002;
  ganTT.hien += (ganTT.muc - ganTT.hien) * k;
  cuaso.style.setProperty('--gan', (1 + (GANCUASO.phong || 0) * ganTT.hien).toFixed(4));
  if(yen){ ganTT.hien = ganTT.muc; ganTT.quay = null; return; }
  ganTT.quay = requestAnimationFrame(ganChay);
}

function ganViTri(x, y){
  var hero = el('hero');

  var maxX = hero.clientWidth  - r.width;
  var maxY = hero.clientHeight - r.height;
  viTri.x = Math.min(Math.max(x, 0), Math.max(0, maxX));
  viTri.y = Math.min(Math.max(y, 0), Math.max(0, maxY));
  cuaso.style.left = viTri.x + 'px';
  cuaso.style.top  = viTri.y + 'px';
  csToado.textContent = 'X:' + so4(viTri.x) + ' Y:' + so4(viTri.y);
}

/* Vị trí mặc định: nằm trong khoảng trống giữa cụm chữ và câu tuyên ngôn */

(function batKeo(){

/* =========================================================================
   3b. CHUYỂN CẢNH — cửa sổ phóng to thành Main Section theo tiến trình cuộn
   Cuộn từ Hero xuống: cửa sổ rời khỏi Hero, lớn dần cho tới khi phủ kín màn
   hình. Video bên trong nhoè dần và tối lại để làm nền cho Main Section.
   ========================================================================= */
var goc = { w:0, h:0 };
var tHienTai = 0;               /* 0 = cửa sổ nhỏ trong Hero, 1 = phủ kín */
var trangThai = 'hero';         /* hero | dang-chay | phu-kin            */

/* Đo kích thước gốc của cửa sổ (lúc chưa nở) mà không gây nháy hình */
function doKichThuocGoc(){
  var phong = cuaso.classList.contains('phongto');
  var w = cuaso.style.width, h = cuaso.style.height;
  cuaso.classList.remove('phongto');
  cuaso.style.width = ''; cuaso.style.height = '';
  goc.w = cuaso.offsetWidth; goc.h = cuaso.offsetHeight;
  if(phong) cuaso.classList.add('phongto');
  cuaso.style.width = w; cuaso.style.height = h;
}

/* Vẽ cửa sổ ở một tiến trình bất kỳ: t = 0 (nhỏ) → 1 (phủ kín màn hình) */
function ve(t){
  var W = window.innerWidth, H = window.innerHeight;
  moVideo(t);

  if(t <= 0){
    cuaso.classList.remove('phongto', 'phu-kin');
    cuaso.style.width = ''; cuaso.style.height = ''; cuaso.style.borderColor = '';
    csThan.style.filter = '';
    csPhu.style.opacity = 0;
    datNutCuaSo(false);            /* về Hero → icon quay lại "phóng to" */
    doKichThuocGoc();
    ganViTri(viTri.x, viTri.y);
    return;
  }

  var k = 1 - t;

  /* Khoảng hở bốn phía cùng co về 0 → cửa sổ nở đều ra mọi hướng */
  var trai = viTri.x * k;
  var phai = Math.max(0, W - viTri.x - goc.w) * k;
  var tren = viTri.y * k;
  var duoi = Math.max(0, H - viTri.y - goc.h) * k;

  cuaso.classList.add('phongto');
  var caoTh = Math.round(el('csThanh').getBoundingClientRect().height) || 34;
  cuaso.style.setProperty('--cao-thanh', caoTh + 'px');
  cuaso.classList.toggle('phu-kin', t >= 0.999);
  cuaso.style.left   = trai + 'px';
  cuaso.style.top    = tren + 'px';
  cuaso.style.width  = Math.max(0, W - trai - phai) + 'px';
  cuaso.style.height = Math.max(0, H - tren - duoi) + 'px';

  csThan.style.filter = 'blur(' + (CHUYEN.mo_toi_da * t).toFixed(2) + 'px)';
  csPhu.style.opacity = (CHUYEN.phu_toi_da * t).toFixed(3);
  cuaso.style.borderColor = 'rgba(18,48,57,' + k.toFixed(3) + ')';

  csToado.textContent = t > 0.5
    ? 'W:' + so4(W - trai - phai) + ' H:' + so4(H - tren - duoi)
    : 'X:' + so4(trai) + ' Y:' + so4(tren);

  datNutCuaSo(t > 0.5);            /* qua nửa đường thì icon đổi sang "thu nhỏ" */
}

/* Chạy hoạt ảnh từ tiến trình hiện tại tới đích (0 hoặc 1) */
function chay(dich, xong){
  var tu = tHienTai, batDau = 0;
  var dai = itDong ? 0 : CHUYEN.thoi_gian;

  if(dai <= 0){ tHienTai = dich; ve(dich); xong && xong(); return; }

  requestAnimationFrame(function buoc(luc){
    if(!batDau) batDau = luc;
    var k = Math.min(1, (luc - batDau) / dai);
    var e = k < 0.5 ? 4*k*k*k : 1 - Math.pow(-2*k + 2, 3) / 2;   /* easeInOutCubic */
    tHienTai = tu + (dich - tu) * e;
    ve(tHienTai);
    if(k < 1) requestAnimationFrame(buoc);
    else { tHienTai = dich; ve(dich); xong && xong(); }
  });
}

/* --- Nở ra --- */
function noRa(){
  if(trangThai !== 'hero') return;
  trangThai = 'dang-chay';
  /* GIỮ khoá trong suốt lúc nở — Hero phải đứng yên tuyệt đối.
     Chỉ mở khoá khi cửa sổ đã phủ kín xong. */
  chay(1, function(){
    trangThai = 'phu-kin';
    document.body.classList.add('da-phu');   /* Hero nhường chỗ cho Main Section */
    document.body.classList.remove('khoa');  /* giờ mới cho cuộn */
    if(manHinh) manHinh.mo();                /* Main Section bắt đầu chạy */
    tatVetChuot = true;                      /* ngưng vệt chuột pixel */
    /* Đưa về đỉnh để Main bắt đầu ngay. Phải nhảy tức thì, không dùng cuộn
       mượt — nếu không sẽ tranh chấp với thao tác cuộn kế tiếp của người xem.
       Người xem không thấy cú nhảy vì cửa sổ đã phủ kín màn hình. */
    var muot = document.documentElement.style.scrollBehavior;
    document.documentElement.style.scrollBehavior = 'auto';
    void document.body.offsetHeight;        /* buộc tính lại bố cục trước đã */
    window.scrollTo(0, 0);
    requestAnimationFrame(function(){ window.scrollTo(0, 0); });
    document.documentElement.style.scrollBehavior = muot;
  });
}

/* --- Thu lại: chỉ khi đã ở đỉnh trang --- */
function thuLai(){
  if(trangThai !== 'phu-kin' || window.scrollY > 2) return;
  trangThai = 'dang-chay';
  document.body.classList.add('khoa');       /* khoá ngay để Hero không trượt */
  document.body.classList.remove('da-phu');
  if(manHinh) manHinh.dong();
  tatVetChuot = false;
  chay(0, function(){ trangThai = 'hero'; });
}

/* --- Bắt thao tác ---
   Ở Hero trang bị khoá cuộn, NHƯNG mọi listener đều là passive: không chặn
   sự kiện nào cả. Lăn chuột, vuốt, bấm phím hay bấm vào màn hình cửa sổ đều
   mở được — nên dù thao tác kiểu gì cũng không bị kẹt lại trong Hero. */
function batChuyenCanh(){
  addEventListener('scroll', function(){
    if(khoaVuot()) return;
    if(trangThai === 'hero' && window.scrollY > CHUYEN.nguong) noRa();
  }, { passive:true });

  /* CHÚ Ý: từ v39, thao tác vuốt / lăn chuột CHỈ dùng để MỞ cửa sổ ra.
     Muốn thoát khỏi Main Section thì bấm nút "−" ở góc phải thanh tiêu đề. */
  addEventListener('wheel', function(e){
    if(khoaVuot()) return;
    if(e.deltaY > 0 && trangThai === 'hero') noRa();
  }, { passive:true });

  var chamY = 0;
  addEventListener('touchstart', function(e){ chamY = e.touches[0].clientY; }, { passive:true });
  addEventListener('touchmove', function(e){
    if(khoaVuot()) return;      /* đang kéo, hoặc đang xem chi tiết → bỏ qua */
    if(trangThai !== 'hero') return;
    if(e.target && e.target.closest &&
       (e.target.closest('.hud') || e.target.closest('.mh-tren'))) return;
    var dy = chamY - e.touches[0].clientY;          /* dương = vuốt lên = cuộn xuống */
    if(dy > 10) noRa();
  }, { passive:true });

  addEventListener('keydown', function(e){
    if(e.target.closest && e.target.closest('#csThanh')) return;   /* để dành cho kéo cửa sổ */
    if(['ArrowDown','PageDown','End',' ','Spacebar'].indexOf(e.key) >= 0){
      if(trangThai === 'hero') noRa();
    }
  });
}
